<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Atelier du Web</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Mise en page : barre d'outils en haut, palette à gauche, zone de travail blanche, panneau de l'appareil à droite (feuille basse sur téléphone). */
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#ffffff;--bar:#eeeeee;--panel:#ffffff;--panel2:#f1f3f6;--field:#ffffff;--line:#b9bfc7;
  --fg:#111111;--muted:#5a6068;--accent:#2e6da4;--accent-fg:#ffffff;--accent-soft:#dcebf8;--accent-ink:#1b4a76;--run:#2e8b3a;
  --canvas:#ffffff;--grid:#ffffff;--cable:#000000;--node-fill:#dfe7f0;--node-stroke:#33475b;--screen:#8ec1e6;
  --note-bg:#fff4c2;--note-line:#d9bf5c;--note-fg:#4a3d05;--page-bg:#ffffff;--page-fg:#1d2733;
  --term-bg:#121a22;--term-fg:#d5e0ea;
  --ok:#1e7a2e;--warn:#9a5b00;--bad:#c0281f;
  --c-arp:#c98a00;--c-icmp:#7b4fc2;--c-dns:#1478b8;--c-dhcp:#c2347f;--c-tcp:#6d8a14;--c-http:#0f8c68;--c-mail:#d1561b;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui)}
button,input,select,textarea{font:inherit;color:inherit}
.inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.band{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:7px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:.01em}
.brand small{font-weight:400;color:var(--muted);font-size:13px}
.files{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font-weight:500;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.del{color:var(--bad)}
:is(button,input,select,textarea,summary):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.seg button[data-mode=sim][aria-pressed="true"]{background:var(--run)}
#simctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#simctl label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
#simctl select{width:auto}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--run);font-weight:500}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.live.paused{color:var(--warn)}
.work{flex:1;min-height:0;display:flex;gap:10px;padding-block:10px}
#palette{flex:none;width:92px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font-weight:500;font-size:11.5px;min-width:74px;text-align:center}
.tool svg{width:34px;height:34px;overflow:visible}
.tool:hover{border-color:var(--accent)}
.tool.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.sep{height:1px;background:var(--line);flex:none;margin:2px 0}
#stage{flex:1;min-width:0;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--canvas);display:flex;flex-direction:column;overflow:hidden}
#hint{flex:none;padding:6px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bar)}
#scroller{flex:1;min-height:0;overflow:auto}
#svg{display:block;width:1400px;height:900px;touch-action:none;user-select:none;-webkit-user-select:none}
.node{cursor:pointer}
.mode-design .node,.mode-doc .note{cursor:grab}
.ic-body{fill:var(--node-fill);stroke:var(--node-stroke);stroke-width:2;stroke-linejoin:round}
.ic-screen{fill:var(--screen);stroke:var(--node-stroke);stroke-width:1.2}
.ic-acc{stroke:var(--accent);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ic-led{fill:var(--accent)}
.nlabel{font:600 12.5px var(--font-ui);fill:var(--fg)}
.nip{font:11px var(--font-mono);fill:var(--muted)}
.selbox{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3}
.lk .selbox{stroke-dasharray:none;stroke-width:2.5}
.cab{stroke:var(--cable);stroke-width:2.2;stroke-linecap:round}
.cab.on{stroke:var(--accent);stroke-width:4}
.hit{stroke:transparent;stroke-width:16;cursor:pointer}
.note rect{fill:var(--note-bg);stroke:var(--note-line)}
.note text{font:12.5px var(--font-ui);fill:var(--note-fg)}
#panel{flex:none;width:360px;max-height:100%;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:0}
#panel.wide{width:clamp(380px,38vw,600px)}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex:none}
.phead b{font-size:15px}
.phead .sub{color:var(--muted);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:6px 10px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{overflow:auto;padding:12px;flex:1;min-height:0}
.pbody.fill{display:flex;flex-direction:column;gap:8px}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;font-size:12.5px;color:var(--muted)}
.fld.chk{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:13px}
.fld.chk input{width:auto}
input[type=text],textarea,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--fg)}
.mono{font-family:var(--font-mono);font-size:12.5px}
textarea{resize:vertical;min-height:70px}
.bad{border-color:var(--bad)!important}
.grp{border:1px solid var(--line);border-radius:8px;padding:10px 10px 2px;margin-bottom:10px}
.grp>h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.line3{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
.line2{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
.small{font-size:12px;color:var(--muted);margin:0 0 9px}
.term{display:flex;flex-direction:column;flex:1;min-height:240px;background:var(--term-bg);color:var(--term-fg);border-radius:8px;font:12.5px/1.5 var(--font-mono);overflow:hidden}
.tout{flex:1;overflow:auto;padding:10px;white-space:pre-wrap;word-break:break-word}
.tout .ok{color:#6fdc9a}.tout .err{color:#ff9a94}.tout .dim{color:#8da0b5}.tout .cmd{color:#fff}
.tin{display:flex;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid #2a3542}
.tin:focus-within{outline:2px solid var(--accent);outline-offset:-2px}
.tin input{flex:1;background:transparent;border:0;color:inherit;font:inherit;outline:none;padding:2px 0}
.tin .prm{color:#6fdc9a;white-space:nowrap}
.bar-url{display:flex;gap:6px}
.bstat{font-size:12.5px;color:var(--muted)}
.page{flex:1;min-height:180px;overflow:auto;background:var(--page-bg);color:var(--page-fg);border:1px solid var(--line);border-radius:6px;padding:14px 16px;font:15px/1.5 Georgia,'Times New Roman',serif}
.page h1{font-size:24px;margin:.2em 0 .4em}.page h2{font-size:19px}.page a{color:#1558c0;text-decoration:underline;cursor:pointer}
.exch{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.extop{display:flex;align-items:center;gap:8px;justify-content:space-between;flex:none}
.tscroll{overflow:auto;border:1px solid var(--line);border-radius:8px;flex:1;min-height:110px}
.tbl{border-collapse:collapse;width:100%;font-size:12px}
.tbl th{position:sticky;top:0;background:var(--panel2);text-align:left;padding:5px 8px;font-weight:600;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl td{padding:4px 8px;white-space:nowrap;border-bottom:1px solid var(--line);font-family:var(--font-mono)}
.tbl td.info{white-space:normal;min-width:150px}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--panel2)}
.tbl tbody tr.sel{background:var(--accent-soft)}
.tbl tr.ign td{opacity:.55}
tr[data-pk=arp] td:first-child{box-shadow:inset 4px 0 var(--c-arp)}tr[data-pk=icmp] td:first-child{box-shadow:inset 4px 0 var(--c-icmp)}
tr[data-pk=dns] td:first-child{box-shadow:inset 4px 0 var(--c-dns)}tr[data-pk=dhcp] td:first-child{box-shadow:inset 4px 0 var(--c-dhcp)}
tr[data-pk=tcp] td:first-child{box-shadow:inset 4px 0 var(--c-tcp)}tr[data-pk=http] td:first-child{box-shadow:inset 4px 0 var(--c-http)}
.detail{overflow:auto;flex:none;max-height:46%}
.layer{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;overflow:hidden}
.layer h4{margin:0;padding:4px 10px;font-size:12px;background:var(--panel2);display:flex;justify-content:space-between}
.layer h4 span{color:var(--muted);font-weight:400}
.kv{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;padding:6px 10px;font-size:12px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--font-mono);white-space:pre-wrap;word-break:break-word}
.layer.empty .kv{color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11.5px;background:var(--panel2)}
.mono-tbl{font:12px var(--font-mono);width:100%;border-collapse:collapse;margin-bottom:10px}
.mono-tbl th{text-align:left;color:var(--muted);font-weight:500;padding:3px 6px;border-bottom:1px solid var(--line)}
.mono-tbl td{padding:3px 6px;border-bottom:1px solid var(--line)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:90vw}
#dlg{position:fixed;inset:0;background:rgba(10,16,22,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlgbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);max-height:88%;display:flex;flex-direction:column}
.dlgbox header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgbox header b{font-size:16px}
.dlgbox .dbody{padding:14px 16px;overflow:auto}
.dlgbox footer{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlgbox h3{margin:14px 0 4px;font-size:14px}.dlgbox p,.dlgbox li{margin:4px 0;font-size:13.5px}.dlgbox code{font-family:var(--font-mono);background:var(--panel2);padding:0 4px;border-radius:4px;font-size:12.5px}
#act{flex:none;width:clamp(280px,24vw,340px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:0;max-height:100%}
#act .pbody{font-size:13.5px}
code.k{font-family:var(--font-mono);background:var(--panel2);padding:0 4px;border-radius:4px;font-size:12.5px;white-space:nowrap}
.goal{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 10px;margin:0 0 10px}
.steps{margin:0 0 10px;padding-left:20px}.steps li{margin-bottom:9px}
.defi{border:1px dashed var(--accent);border-radius:8px;padding:8px 10px;margin:0 0 12px}.defi p{margin:6px 0}
.defi summary{cursor:pointer;font-weight:500;color:var(--accent-ink)}
fieldset.q{border:1px solid var(--line);border-radius:8px;padding:8px 10px 6px;margin:0 0 10px;min-width:0}
fieldset.q legend{font-weight:600;padding:0 4px;max-width:100%}
.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:6px;cursor:pointer}
.opt input{margin-top:3px;width:auto;flex:none}
.opt.good{background:rgba(30,122,46,.15)}.opt.bad{background:rgba(192,40,31,.15)}
.why{font-size:12.5px;color:var(--muted);margin:6px 4px 2px}
.score{font-weight:600;font-size:15px;margin:4px 0 8px}
#course{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.ctop,.cwrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ctop{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);background:var(--bar)}
.cwrap{flex:1;min-height:0;display:flex;gap:28px;padding-block:14px}
.ctoc{flex:none;width:250px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.ctoc button{display:block;width:100%;text-align:left;padding:6px 10px;border:0;border-left:3px solid transparent;background:transparent;cursor:pointer;font-size:13.5px}
.ctoc button:hover{background:var(--panel2)}
.ctoc button.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.ctoc-sel{display:none;margin:8px max(16px,env(safe-area-inset-left,0px)) 0;width:auto}
.cbody{flex:1;min-width:0;overflow:auto;max-width:860px;padding-right:6px}
.ckick{color:var(--muted);font-size:12.5px;margin:0}
.cbody h2{font-size:26px;margin:2px 0 12px;text-wrap:balance}
.cbody h3{font-size:16.5px;margin:22px 0 6px}
.cbody p,.cbody li{font-size:14.5px;line-height:1.6}
.cbody ul,.cbody ol{padding-left:22px}.cbody li{margin-bottom:4px}
.cbody table{display:block;overflow-x:auto;max-width:100%}
.ctable{border-collapse:collapse;font-size:13.5px;margin:8px 0 12px}
.ctable th,.ctable td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.ctable th{background:var(--panel2);font-weight:600}
.ctable.narrow td,.ctable.narrow th{text-align:center;font-family:var(--font-mono);font-size:13px}
.ctable td.on1{background:var(--accent);color:var(--accent-fg);font-weight:600}
.retain{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:9px 12px;margin:16px 0 6px;font-size:14px}
.bits{font:13px var(--font-mono);overflow-x:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;background:var(--panel2)}
.bits>div{display:flex;white-space:nowrap;align-items:baseline;line-height:1.8}
.bits .lbl{width:96px;flex:none;color:var(--muted);font-family:var(--font-ui);font-size:12px}
.bits .n{color:var(--accent-ink);font-weight:600}.bits .m{color:#8a949f}
.bits .dec{margin-left:14px;color:var(--fg);font-family:var(--font-ui);font-size:12.5px}
.encap{display:flex;flex-wrap:wrap;margin:8px 0 12px}
.encap span{padding:7px 14px;font:13px var(--font-mono);border:1px solid var(--node-stroke);margin-left:-1px}
.encap .e4{background:#f6dede}.encap .e3{background:#dfeaf7}.encap .e2{background:#e0f1dc}.encap .e1{background:#fff4c2}
.widget{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0 14px;background:var(--panel)}
.verdict{border-radius:8px;padding:9px 12px;margin-top:10px;font-size:14px}
.verdict.yes{background:rgba(30,122,46,.15)}.verdict.no{background:rgba(192,40,31,.13)}
.formula{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;font-size:15px}
.bars{display:flex;flex-direction:column;gap:6px;margin-top:10px}.bars>div{display:flex;align-items:center;gap:8px}
.bars .bl{width:44px;flex:none;font-size:12.5px;color:var(--muted)}.bars .bar{display:inline-block;height:14px;background:var(--accent);border-radius:3px}.bars .bar.alt{background:var(--run)}.bars .bv{font:13px var(--font-mono)}
input[type=range]{width:100%;padding:0}
.gloss{display:grid;grid-template-columns:max-content 1fr;gap:5px 18px;font-size:14px}.gloss dt{font-weight:600}.gloss dd{margin:0}
.cpn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 32px}
@media (max-width:820px){
  .ctoc{display:none}.ctoc-sel{display:block}.cwrap{padding-top:8px}.cbody{padding-right:0}.gloss{grid-template-columns:1fr}.gloss dd{margin-bottom:6px}
  #act{position:fixed;left:0;right:0;bottom:0;width:auto;height:70%;max-height:none;border-radius:14px 14px 0 0;z-index:35;box-shadow:0 -8px 30px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom,0px)}
  .work{flex-direction:column;gap:8px}
  #palette{flex-direction:row;width:auto;overflow-x:auto;overflow-y:hidden;flex:none}
  .sep{width:1px;height:auto;margin:0 2px}
  .tool{min-width:70px}
  #panel,#panel.wide{position:fixed;left:0;right:0;bottom:0;width:auto;height:62%;max-height:none;border-radius:14px 14px 0 0;z-index:30;box-shadow:0 -8px 30px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .phead,.pbody,.tabs{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .line3{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:no-preference){.tool,.btn{transition:border-color .12s,background .12s}}
/* ---- ateliers : commun, 1 et 2 ---- */
#ws{padding:16px max(16px,env(safe-area-inset-left,0px)) 30px;max-width:980px}
#ws h2{font-size:24px;margin:0 0 8px;text-wrap:balance}
#ws h3{font-size:16.5px;margin:24px 0 6px}
#ws p,#ws li{font-size:14.5px;line-height:1.55}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.stack{margin:14px 0;display:flex;flex-direction:column;gap:6px}
.stk-row{display:flex;gap:6px;flex-wrap:wrap}
.stk{border:1px solid var(--node-stroke);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stk b{font-size:15px}.stk span{font-size:12.5px;color:var(--muted)}

const COURSE = [];
COURSE.push({ id: 'web', t: 'Web et Internet', h: `
<p>On emploie souvent « Internet » et « Web » pour la même chose. Ce sont pourtant deux notions différentes.</p>
<table class="ctable"><thead><tr><th></th><th>Internet</th><th>Le Web</th></tr></thead><tbody>
<tr><td><b>Nature</b></td><td>Un réseau de réseaux : câbles, routeurs, protocoles.</td><td>Un service : des pages reliées par des liens.</td></tr>
<tr><td><b>Protocoles</b></td><td>IP, TCP, UDP, DNS…</td><td>HTTP (et HTTPS)</td></tr>
<tr><td><b>Langages et formats</b></td><td>-</td><td>HTML, CSS, URL</td></tr>
<tr><td><b>Matériel et logiciels</b></td><td>Routeurs, commutateurs, modems.</td><td>Navigateurs, serveurs web.</td></tr>
</tbody></table>
<p>D’autres services utilisent Internet sans être le Web : le courrier électronique (SMTP, POP3, IMAP), la visioconférence, les jeux en ligne, le transfert de fichiers.</p>
<h3>Client et serveur</h3>
<ul>
<li>Le <b>navigateur</b> (Firefox, Chrome, Safari, Edge…) est le <b>client</b> : il demande des pages.</li>
<li>Le <b>serveur web</b> est un programme, sur une machine toujours allumée, qui répond aux demandes en envoyant des pages.</li>
<li>Le client demande, le serveur répond : c’est toujours le client qui commence.</li>
</ul>
<h3>Vocabulaire</h3>
<ul>
<li>Une <b>page web</b> est un document (en HTML) affiché par un navigateur. Un <b>site web</b> est un ensemble de pages d’un même domaine.</li>
<li>Un <b>lien hypertexte</b> relie une page à une autre : en cliquant, on passe de l’une à l’autre. C’est l’idée centrale du Web.</li>
<li>Une <b>ressource</b> est n’importe quel élément qu’on peut demander : page, image, feuille de style, vidéo.</li>
</ul>
<div class="retain"><b>À retenir.</b> Internet = l’infrastructure. Le Web = un service qui l’utilise, fondé sur HTTP, HTML et les URL. Navigateur = client, serveur web = serveur.</div>` });

COURSE.push({ id: 'histoire', t: 'Histoire du Web', h: `
<table class="ctable"><thead><tr><th>Date</th><th>Événement</th></tr></thead><tbody>
<tr><td>1969</td><td>ARPANET : premiers ordinateurs reliés en réseau, aux États-Unis.</td></tr>
<tr><td>1983</td><td>TCP/IP est adopté : Internet devient un réseau de réseaux.</td></tr>
<tr><td>1989</td><td>Au CERN (Suisse), Tim Berners-Lee propose un système de documents reliés par des liens, pour partager les connaissances des chercheurs.</td></tr>
<tr><td>1990</td><td>Premier navigateur et premier serveur web. Il invente HTML, HTTP et les URL, avec l’aide de collègues dont Robert Cailliau.</td></tr>
<tr><td>1991</td><td>Premier site web ouvert au public : il présente le projet lui-même.</td></tr>
<tr><td>1993</td><td>Le CERN place la technologie du Web dans le domaine public : n’importe qui peut l’utiliser librement. Le navigateur Mosaic popularise le Web.</td></tr>
<tr><td>1994</td><td>Création du W3C, qui publie les standards du Web (HTML, CSS…).</td></tr>
<tr><td>1998</td><td>Google : un moteur qui classe les pages en tenant compte des liens.</td></tr>
<tr><td>2001</td><td>Wikipédia : l’encyclopédie écrite par ses lecteurs.</td></tr>
<tr><td>2004 et après</td><td>Les réseaux sociaux : le Web devient participatif. Chacun publie du contenu.</td></tr>
<tr><td>2007 et après</td><td>Les smartphones : le Web dans la poche.</td></tr>
<tr><td>vers 2016</td><td>Des certificats gratuits généralisent le HTTPS.</td></tr>
</tbody></table>
<h3>Trois idées qui ont fait le succès du Web</h3>
<ul>
<li><b>Un standard ouvert et gratuit</b> : tout le monde peut créer un site ou un navigateur.</li>
<li><b>Une adresse unique par ressource</b> : l’URL.</li>
<li><b>Le lien hypertexte</b> : n’importe quelle page peut pointer vers n’importe quelle autre.</li>
</ul>
<div class="retain"><b>À retenir.</b> Internet date de 1969 à 1983. Le Web a été inventé en 1989-1991 par Tim Berners-Lee au CERN. Le W3C maintient ses standards.</div>` });

COURSE.push({ id: 'url', t: 'Client, serveur et URL', h: `
<p>Une <b>URL</b> (<i>Uniform Resource Locator</i>) est l’adresse d’une ressource du Web. Elle contient tout ce qu’il faut pour la trouver. Modifiez celle-ci pour voir chaque morceau :</p>
<div class="widget" data-w="url"></div>
<h3>Les parties d’une URL</h3>
<table class="ctable"><thead><tr><th>Partie</th><th>Exemple</th><th>Rôle</th></tr></thead><tbody>
<tr><td>Protocole</td><td><code>https://</code></td><td>Comment dialoguer : http (non chiffré) ou https (chiffré).</td></tr>
<tr><td>Nom de domaine</td><td><code>www.lycee-exemple.fr</code></td><td>Quel serveur. Traduit en adresse IP par le DNS.</td></tr>
<tr><td>Port (facultatif)</td><td><code>:8080</code></td><td>Quel programme du serveur. Par défaut 80 pour http, 443 pour https.</td></tr>
<tr><td>Chemin</td><td><code>/snt/reseaux.html</code></td><td>Quelle page sur le serveur.</td></tr>
<tr><td>Paramètres (facultatif)</td><td><code>?page=2&amp;lang=fr</code></td><td>Informations envoyées au serveur, sous la forme clé=valeur séparées par &amp;.</td></tr>
<tr><td>Ancre (facultative)</td><td><code>#masques</code></td><td>Endroit précis de la page. Elle n’est pas envoyée au serveur.</td></tr>
</tbody></table>
<h3>Lire un nom de domaine</h3>
<p>On le lit de <b>droite à gauche</b>.</p>
<div class="encap"><span class="e4">fr</span><span class="e3">lycee-exemple</span><span class="e2">www</span></div>
<ul>
<li><b>fr</b> : le domaine de premier niveau (extension : .fr, .com, .org…).</li>
<li><b>lycee-exemple.fr</b> : le <b>domaine principal</b>, choisi et réservé par le propriétaire.</li>
<li><b>www</b> : un <b>sous-domaine</b>. Le propriétaire du domaine peut en créer autant qu’il veut : aide.lycee-exemple.fr, par exemple.</li>
</ul>
<p>Pour savoir à qui appartient un site, on regarde le domaine principal, c’est-à-dire ce qui précède immédiatement l’extension. Tout ce qui est à gauche est choisi par le propriétaire du domaine.</p>
<p>Le <b>nom de domaine</b> est traduit en <b>adresse IP</b> par le DNS (voir la page sur le réseau).</p>
<div class="retain"><b>À retenir.</b> URL = protocole + nom de domaine + chemin (+ port, paramètres, ancre). Le domaine principal est juste avant l’extension.</div>` });

COURSE.push({ id: 'http', t: 'Le protocole HTTP', h: `
<p><b>HTTP</b> (<i>HyperText Transfer Protocol</i>) fixe comment un navigateur demande une ressource et comment le serveur répond.</p>
<h3>Ce qui se passe quand on tape une adresse</h3>
<ol>
<li><b>DNS</b> : le navigateur obtient l’adresse IP du nom de domaine.</li>
<li><b>TCP</b> : il ouvre une connexion vers cette adresse (port 80, ou 443 pour https).</li>
<li><b>TLS</b> (seulement en https) : le serveur présente son certificat, les deux côtés choisissent une clé de chiffrement.</li>
<li><b>HTTP</b> : requête, puis réponse.</li>
<li>Le navigateur affiche la page. S’il manque des ressources (images, feuille de style), il envoie d’autres requêtes : une page web demande en général plusieurs dizaines de requêtes.</li>
</ol>
<h3>La requête</h3>
<pre class="code">GET /snt HTTP/1.1
Host: www.lycee-exemple.fr
User-Agent: navigateur-exemple
Accept: text/html</pre>
<ul>
<li><b>Première ligne</b> : la méthode, le chemin, la version du protocole.</li>
<li><b>GET</b> demande une ressource. <b>POST</b> envoie des données au serveur (par exemple un formulaire de connexion) dans le corps de la requête.</li>
<li><b>Host</b> : le nom de domaine voulu. Un même serveur peut héberger plusieurs sites.</li>
</ul>
<h3>La réponse</h3>
<pre class="code">HTTP/1.1 200 OK
Content-Type: text/html; charset=utf-8
Content-Length: 118

&lt;h1&gt;SNT en seconde&lt;/h1&gt; ...</pre>
<ul>
<li><b>Ligne d’état</b> : version, code, texte du code.</li>
<li><b>En-têtes</b> : informations sur la réponse (type de contenu, taille, cookie…).</li>
<li><b>Corps</b> : le contenu (ici du HTML).</li>
</ul>
<h3>Les codes de réponse</h3>
<table class="ctable"><thead><tr><th>Code</th><th>Famille</th><th>Signification</th></tr></thead><tbody>
<tr><td><b>200</b> OK</td><td rowspan="1">2xx : succès</td><td>La ressource est envoyée.</td></tr>
<tr><td><b>301</b> Moved Permanently</td><td>3xx : redirection</td><td>La page a changé d’adresse (en-tête <code>Location</code>). Le navigateur renvoie une requête vers la nouvelle adresse.</td></tr>
<tr><td><b>403</b> Forbidden</td><td rowspan="2">4xx : erreur du client</td><td>Accès interdit.</td></tr>
<tr><td><b>404</b> Not Found</td><td>La ressource n’existe pas.</td></tr>
<tr><td><b>500</b> Internal Server Error</td><td>5xx : erreur du serveur</td><td>Le serveur a rencontré un problème.</td></tr>
</tbody></table>
<h3>HTTP ne se souvient de rien</h3>
<p>Chaque requête est indépendante : le serveur ne sait pas, a priori, que deux requêtes viennent du même visiteur. Pour garder un panier ou une connexion, les sites utilisent des <b>cookies</b> (voir la section suivante sur les cookies).</p>
<div class="retain"><b>À retenir.</b> Le client envoie une requête (méthode, chemin, en-têtes), le serveur répond (code, en-têtes, corps). 200 = succès, 301 = redirection, 404 = introuvable, 500 = erreur serveur.</div>` });

COURSE.push({ id: 'html', t: 'HTML : structurer une page', h: `
<p>Le <b>HTML</b> (<i>HyperText Markup Language</i>) est un langage à <b>balises</b> qui décrit le <b>contenu</b> et la <b>structure</b> d’une page : ceci est un titre, ceci un paragraphe, ceci un lien.</p>
<h3>Anatomie d’une balise</h3>
<pre class="code">&lt;a href="http://cours-reseaux.fr"&gt;Cours sur les réseaux&lt;/a&gt;
 ↑ balise ouvrante + attribut        ↑ contenu          ↑ balise fermante</pre>
<ul>
<li>Une balise s’écrit entre <code>&lt;</code> et <code>&gt;</code>. La plupart vont par paires : ouvrante <code>&lt;p&gt;</code> et fermante <code>&lt;/p&gt;</code>.</li>
<li>Un <b>attribut</b> précise une balise : <code>href</code> donne l’adresse d’un lien, <code>src</code> la source d’une image, <code>alt</code> son texte de remplacement.</li>
<li>Certaines balises n’ont pas de contenu et ne se ferment pas : <code>&lt;img&gt;</code>, <code>&lt;br&gt;</code>, <code>&lt;hr&gt;</code>.</li>
<li>Les balises s’<b>imbriquent</b> : une liste contient des éléments, un élément contient du texte. On obtient un <b>arbre</b> (voir l’onglet « Structure » de l’atelier).</li>
</ul>
<h3>Structure d’un document</h3>
<pre class="code">&lt;!doctype html&gt;
&lt;html lang="fr"&gt;
  &lt;head&gt;
    &lt;meta charset="utf-8"&gt;
    &lt;title&gt;Titre de l’onglet&lt;/title&gt;
  &lt;/head&gt;
  &lt;body&gt;
    &lt;h1&gt;Titre de la page&lt;/h1&gt;
    &lt;p&gt;Un paragraphe.&lt;/p&gt;
  &lt;/body&gt;
&lt;/html&gt;</pre>
<p>Le <code>head</code> contient des informations sur la page (titre de l’onglet, jeu de caractères, feuille de style). Le <code>body</code> contient ce qui s’affiche.</p>
<h3>Balises courantes</h3>
<table class="ctable"><thead><tr><th>Balise</th><th>Rôle</th></tr></thead><tbody>
<tr><td><code>h1</code> à <code>h6</code></td><td>Titres, du plus important au moins important.</td></tr>
<tr><td><code>p</code></td><td>Paragraphe.</td></tr>
<tr><td><code>a href="…"</code></td><td>Lien hypertexte.</td></tr>
<tr><td><code>img src="…" alt="…"</code></td><td>Image avec texte de remplacement.</td></tr>
<tr><td><code>ul</code>, <code>ol</code>, <code>li</code></td><td>Liste à puces, liste numérotée, élément de liste.</td></tr>
<tr><td><code>table</code>, <code>tr</code>, <code>td</code>, <code>th</code></td><td>Tableau, ligne, cellule, cellule d’en-tête.</td></tr>
<tr><td><code>strong</code>, <code>em</code></td><td>Texte important, texte mis en relief.</td></tr>
<tr><td><code>div</code>, <code>span</code></td><td>Regroupements sans signification particulière (bloc, ou dans une ligne).</td></tr>
<tr><td><code>header</code>, <code>nav</code>, <code>main</code>, <code>footer</code></td><td>Parties de la page : en-tête, menu, contenu principal, pied de page.</td></tr>
</tbody></table>
<h3>Pourquoi bien écrire son HTML ?</h3>
<ul>
<li>Un navigateur est <b>tolérant</b> : il corrige un code incorrect de son mieux, mais le résultat peut être surprenant.</li>
<li>Les <b>textes alternatifs</b> (<code>alt</code>) et les titres bien hiérarchisés rendent la page accessible aux lecteurs d’écran.</li>
<li>Les moteurs de recherche lisent la structure : le contenu de <code>h1</code> ou de <code>title</code> compte plus que le reste du texte.</li>
</ul>
<h3>À faire dans votre navigateur</h3>
<p>Sur n’importe quel site : <b>Ctrl + U</b> affiche le code source de la page, <b>F12</b> ouvre les outils de développement, avec l’arbre des balises. Vous voyez le HTML que le serveur a envoyé.</p>
<div class="retain"><b>À retenir.</b> HTML = contenu et structure, avec des balises et des attributs imbriqués. Le navigateur transforme ce code en page affichée.</div>` });

COURSE.push({ id: 'css', t: 'CSS : mettre en forme', h: `
<p>Le <b>CSS</b> (<i>Cascading Style Sheets</i>, « feuilles de style en cascade ») décrit la <b>présentation</b> : couleurs, polices, tailles, marges, positions.</p>
<h3>Une règle CSS</h3>
<pre class="code">h1 {
  color: darkblue;
  text-align: center;
}</pre>
<ul>
<li><b>h1</b> est le <b>sélecteur</b> : il désigne les éléments concernés.</li>
<li><b>color</b> et <b>text-align</b> sont des <b>propriétés</b>.</li>
<li><b>darkblue</b> et <b>center</b> sont les <b>valeurs</b>. Chaque déclaration se termine par un point-virgule.</li>
</ul>
<h3>Les sélecteurs</h3>
<table class="ctable"><thead><tr><th>Sélecteur</th><th>Désigne</th></tr></thead><tbody>
<tr><td><code>p</code></td><td>Tous les paragraphes.</td></tr>
<tr><td><code>.important</code></td><td>Tous les éléments avec <code>class="important"</code>.</td></tr>
<tr><td><code>#titre</code></td><td>L’élément avec <code>id="titre"</code> (un id est unique dans la page).</td></tr>
<tr><td><code>ul li</code></td><td>Les <code>li</code> situés à l’intérieur d’un <code>ul</code>.</td></tr>
</tbody></table>
<h3>Quelques propriétés</h3>
<table class="ctable"><thead><tr><th>Propriété</th><th>Effet</th><th>Exemple</th></tr></thead><tbody>
<tr><td><code>color</code></td><td>Couleur du texte</td><td><code>color: red;</code></td></tr>
<tr><td><code>background-color</code></td><td>Couleur de fond</td><td><code>background-color: lightyellow;</code></td></tr>
<tr><td><code>font-family</code>, <code>font-size</code></td><td>Police, taille</td><td><code>font-size: 18px;</code></td></tr>
<tr><td><code>font-weight</code></td><td>Gras</td><td><code>font-weight: bold;</code></td></tr>
<tr><td><code>text-align</code></td><td>Alignement</td><td><code>text-align: center;</code></td></tr>
<tr><td><code>margin</code>, <code>padding</code></td><td>Espace autour, espace dedans</td><td><code>padding: 10px;</code></td></tr>
<tr><td><code>border</code></td><td>Bordure</td><td><code>border: 2px solid black;</code></td></tr>
</tbody></table>
<p>Une couleur s’écrit par son <b>nom</b> (<code>red</code>), en <b>hexadécimal</b> <code>#rrggbb</code> (<code>#2e6da4</code> : rouge 2e, vert 6d, bleu a4) ou avec <code>rgb(46, 109, 164)</code>.</p>
<h3>Cascade et héritage</h3>
<ul>
<li>Quand deux règles s’appliquent au même élément, la plus <b>précise</b> l’emporte ; à précision égale, la <b>dernière</b> écrite l’emporte.</li>
<li>Beaucoup de propriétés (couleur du texte, police) sont <b>héritées</b> : un élément les reprend de son parent.</li>
</ul>
<h3>Où écrire le CSS ?</h3>
<ul>
<li>Dans un fichier à part <code>style.css</code>, relié avec <code>&lt;link rel="stylesheet" href="style.css"&gt;</code> (la meilleure solution : une feuille pour tout un site).</li>
<li>Dans une balise <code>&lt;style&gt;</code> de la page.</li>
<li>Dans un attribut <code>style="…"</code> sur un élément.</li>
</ul>
<div class="retain"><b>À retenir.</b> HTML = quoi (contenu, structure). CSS = comment (présentation). Une règle : sélecteur { propriété: valeur; }. Séparer les deux permet de changer l’apparence sans toucher au contenu.</div>` });

COURSE.push({ id: 'moteurs', t: 'Les moteurs de recherche', h: `
<p>Un moteur de recherche ne parcourt pas le Web quand vous tapez une requête : il l’a fait avant. Il travaille en trois étapes.</p>
<h3>1. Explorer</h3>
<p>Des programmes appelés <b>robots d’indexation</b> (<i>crawlers</i>) partent de pages connues, lisent chaque page et <b>suivent tous ses liens</b>, de proche en proche. Une page que personne ne cite n’est jamais découverte, sauf si son propriétaire la signale au moteur. Un fichier <code>robots.txt</code> permet à un site de demander aux robots d’éviter certaines pages.</p>
<h3>2. Indexer</h3>
<p>Pour chaque page lue, le moteur note les mots qu’elle contient (sans les mots vides comme « le » ou « de »). Il construit un <b>index</b> : pour chaque mot, la liste des pages qui le contiennent.</p>
<table class="ctable"><thead><tr><th>Mot</th><th>Pages qui le contiennent</th></tr></thead><tbody>
<tr><td>web</td><td>web-histoire.fr, lycee-exemple.fr/snt, cours-reseaux.fr…</td></tr>
<tr><td>chocolat</td><td>cuisine-facile.fr/gateau, gateau-gratuit.fr…</td></tr>
</tbody></table>
<p>Grâce à cet index, le moteur répond en une fraction de seconde sans relire le Web.</p>
<h3>3. Classer</h3>
<p>À chaque requête, le moteur retrouve les pages qui contiennent les mots demandés, puis les <b>classe</b> avec plusieurs critères :</p>
<ul>
<li>la <b>pertinence</b> : combien de fois et où les mots apparaissent (le titre compte plus que le texte) ;</li>
<li>la <b>popularité</b> : combien de pages pointent vers elle. L’idée du <b>PageRank</b> de Google (1998) est qu’une page est importante si des pages importantes pointent vers elle ;</li>
<li>d’autres critères : langue, lieu, fraîcheur, vitesse de chargement, et la <b>personnalisation</b> d’après l’historique de l’utilisateur.</li>
</ul>
<h3>Référencement et triche</h3>
<ul>
<li>Le <b>référencement</b> (SEO) consiste à améliorer la position d’un site : bons titres, contenu utile, liens depuis d’autres sites.</li>
<li>Répéter un mot-clé des dizaines de fois (le <b>bourrage de mots-clés</b>) est une triche que les moteurs pénalisent : c’est le rôle des critères de popularité. C’est ce que montre le faux site « gateau-gratuit.fr » de l’atelier.</li>
</ul>
<h3>Publicité, biais et esprit critique</h3>
<ul>
<li>Les résultats <b>sponsorisés</b> sont payés par des annonceurs et signalés comme tels.</li>
<li>Le moteur garde souvent trace de vos requêtes : ce sont des données personnelles.</li>
<li>L’ordre des résultats n’est pas une mesure de vérité. Il faut croiser plusieurs sources et regarder qui publie.</li>
<li>Une grande partie du Web n’est pas indexée : pages derrière un mot de passe, messageries, pages sans lien entrant.</li>
</ul>
<div class="retain"><b>À retenir.</b> Un moteur explore (robot et liens), indexe (mot → pages), puis classe (pertinence et popularité) pour chaque requête. Les résultats dépendent du moteur, de l’utilisateur et de la publicité.</div>` });

COURSE.push({ id: 'cookies', t: 'Cookies et traces', h: `
<h3>Qu’est-ce qu’un cookie ?</h3>
<p>Un <b>cookie</b> est une petite information qu’un site demande au navigateur de mémoriser, et que le navigateur lui <b>renvoie à chaque requête suivante</b> vers ce site.</p>
<pre class="code">Réponse du serveur :   Set-Cookie: session=S1000; Path=/
Requêtes suivantes :   Cookie: session=S1000</pre>
<h3>À quoi servent-ils ?</h3>
<ul>
<li><b>Garder une session</b> : rester connecté, garder un panier. Le cookie contient seulement un identifiant ; le panier est stocké sur le serveur, qui retrouve votre session grâce à cet identifiant.</li>
<li><b>Mémoriser des préférences</b> : langue, thème.</li>
<li><b>Mesurer l’audience</b>, et surtout <b>suivre les internautes</b> pour la publicité.</li>
</ul>
<p>Un cookie de <b>session</b> disparaît à la fermeture du navigateur ; un cookie <b>persistant</b> a une date d’expiration (parfois très lointaine).</p>
<h3>Cookies propres et cookies tiers</h3>
<ul>
<li>Un cookie <b>propre</b> est déposé par le site que vous visitez.</li>
<li>Un cookie <b>tiers</b> est déposé par un autre domaine dont le contenu est intégré dans la page (publicité, bouton de partage…).</li>
</ul>
<p>Si deux sites intègrent la publicité du même tiers, le navigateur renvoie à ce tiers <b>le même cookie</b> depuis les deux sites. Le tiers reconnaît alors le visiteur et reconstitue sa navigation, pour lui proposer des publicités ciblées. C’est ce que montre l’atelier.</p>
<h3>Autres traceurs</h3>
<ul>
<li>Les <b>pixels espions</b> : images invisibles chargées depuis un serveur de suivi.</li>
<li>L’<b>empreinte numérique</b> (<i>fingerprinting</i>) : combinaison de réglages du navigateur (écran, polices, langue…) assez unique pour reconnaître un visiteur sans cookie.</li>
<li>L’<b>adresse IP</b>, que tout site visité reçoit.</li>
</ul>
<h3>Le cadre juridique</h3>
<ul>
<li>Les traces laissées sur le Web sont des <b>données personnelles</b> : elles permettent de reconnaître une personne.</li>
<li>Le <b>RGPD</b> (règlement européen, en vigueur depuis 2018) encadre leur usage. En France, la <b>CNIL</b> contrôle son application.</li>
<li>Pour les cookies qui ne sont pas indispensables (traçage publicitaire), le site doit demander le <b>consentement</b> : libre, éclairé, spécifique. <b>Refuser doit être aussi simple qu’accepter.</b></li>
<li>Les cookies strictement nécessaires (session, panier) ne demandent pas de consentement.</li>
</ul>
<h3>Se protéger</h3>
<ul>
<li>Refuser les cookies non nécessaires, effacer régulièrement les cookies, bloquer les cookies tiers dans les paramètres du navigateur.</li>
<li>La <b>navigation privée</b> n’enregistre ni l’historique ni les cookies après fermeture de la fenêtre, mais ne rend pas anonyme : le site visité, votre fournisseur d’accès, ou votre établissement voient quand même la connexion.</li>
</ul>
<h3>À faire dans votre navigateur</h3>
<p>Ouvrez les outils de développement (<b>F12</b>), onglet « Application » ou « Stockage », rubrique « Cookies » : vous voyez les cookies du site avec leur nom, leur valeur et leur date d’expiration. Les réglages de confidentialité du navigateur permettent de les effacer ou de les bloquer.</p>
<div class="retain"><b>À retenir.</b> Cookie = information renvoyée au site à chaque requête (Set-Cookie puis Cookie). Les cookies tiers permettent de suivre un internaute d’un site à l’autre. Le RGPD exige un consentement clair pour les cookies non nécessaires.</div>` });

COURSE.push({ id: 'secu', t: 'Sécurité : HTTPS et hameçonnage', h: `
<h3>HTTP et HTTPS</h3>
<p>En <b>HTTP</b>, tout circule en clair : une personne qui écoute le réseau (Wi-Fi public, par exemple) peut lire les pages, les mots de passe, les formulaires. <b>HTTPS</b> est HTTP à l’intérieur d’une connexion chiffrée par le protocole <b>TLS</b> (successeur de SSL), sur le port 443. Il apporte :</p>
<ul>
<li>la <b>confidentialité</b> : un espion ne voit que des données illisibles ;</li>
<li>l’<b>intégrité</b> : le contenu ne peut pas être modifié en route sans que cela se voie ;</li>
<li>l’<b>authenticité</b> : on a la preuve que l’on parle bien au serveur qui détient le certificat du nom de domaine.</li>
</ul>
<h3>Chiffrer, en deux mots</h3>
<ul>
<li>Chiffrer transforme un message en suite illisible à l’aide d’une <b>clé</b> ; sans la clé, on ne peut pas retrouver le message.</li>
<li>Au début d’une connexion TLS, le navigateur et le serveur utilisent un <b>chiffrement à clé publique</b> pour se mettre d’accord sur une clé secrète commune, puis chiffrent toute la suite avec elle.</li>
</ul>
<h3>Le certificat</h3>
<p>Un <b>certificat</b> associe une clé à un <b>nom de domaine</b>. Il est signé par une <b>autorité de certification</b> que le navigateur connaît. Le navigateur vérifie que le nom du certificat correspond au site visité, que l’autorité est reconnue et que le certificat n’est pas expiré. Sinon, il affiche un avertissement.</p>
<p><b>Attention</b> : le cadenas prouve que la <b>connexion</b> est protégée vers le domaine affiché, pas que le site est honnête. Des sites frauduleux utilisent aussi HTTPS.</p>
<h3>L’hameçonnage (<i>phishing</i>)</h3>
<p>Un message (courriel, SMS) imite une banque, une administration ou un service connu et pousse à cliquer sur un lien vers un <b>faux site</b> pour récupérer identifiants, mots de passe ou numéros de carte.</p>
<ul>
<li><b>Lire le domaine</b> : de droite à gauche, jusqu’au premier point avant l’extension. <code>banque-exemple.fr.verif-securite.com</code> appartient à <code>verif-securite.com</code>.</li>
<li>Repérer les <b>fausses lettres</b> (<code>banque-exemp1e.fr</code>), les tirets ajoutés, les extensions inhabituelles.</li>
<li>Se méfier de l’<b>urgence</b>, de la menace (« compte bloqué »), des fautes, des pièces jointes inattendues.</li>
<li>Ne pas cliquer : taper soi-même l’adresse du site ou utiliser ses favoris.</li>
<li>Signaler le message, et si l’on a donné ses informations, changer le mot de passe et prévenir l’organisme concerné. Le site <b>cybermalveillance.gouv.fr</b> propose de l’aide.</li>
</ul>
<h3>Quelques bonnes pratiques</h3>
<ul>
<li>Un mot de passe <b>long</b>, <b>différent pour chaque site</b>, éventuellement géré par un gestionnaire de mots de passe.</li>
<li>La <b>double authentification</b> quand elle existe.</li>
<li>Mettre à jour le système et le navigateur.</li>
<li>Éviter de saisir des informations sensibles sur un site en HTTP, ou depuis un Wi-Fi public sans protection.</li>
</ul>
<div class="retain"><b>À retenir.</b> HTTPS = HTTP + TLS : confidentialité, intégrité, authenticité du serveur. Le cadenas ne garantit pas l’honnêteté. Contre l’hameçonnage : lire le domaine principal, ne pas cliquer sous la pression.</div>` });

COURSE.push({ id: 'limites', t: 'Ce que la page simplifie', h: `
<p>Cette page est un outil pédagogique. Elle simplifie la réalité sur plusieurs points :</p>
<ul>
<li>Le Web des ateliers est <b>fictif</b> : aucun vrai site n’est affiché ni consulté.</li>
<li>Le simulateur HTTP ne montre qu’une requête par page : en réalité, images, feuilles de style et scripts déclenchent d’autres requêtes. Il n’y a ni cache ni compression.</li>
<li>L’aperçu HTML n’exécute <b>aucun script</b> ; les formulaires et les images extérieures sont ignorés. Seules deux images sont disponibles : logo.svg et planete.svg.</li>
<li>Le moteur de recherche est très simplifié : il exige tous les mots, compte les occurrences et les liens entrants, sans calcul itératif de type PageRank, sans personnalisation.</li>
<li>Les cookies sont simplifiés (pas de durée de vie, pas de SameSite détaillé). Le « chiffrement » affiché pour HTTPS est une illustration, pas un vrai algorithme.</li>
<li>Les durées et les identifiants sont fictifs.</li>
</ul>` });

COURSE.push({ id: 'glossaire', t: 'Glossaire', h: `
<dl class="gloss">
<dt>Attribut</dt><dd>Précision donnée à une balise HTML (href, src, alt…).</dd>
<dt>Balise</dt><dd>Élément de syntaxe HTML écrit entre &lt; et &gt;.</dd>
<dt>Certificat</dt><dd>Document qui associe une clé à un nom de domaine, signé par une autorité.</dd>
<dt>Chiffrement</dt><dd>Transformation d’un message en suite illisible sans la clé.</dd>
<dt>Client</dt><dd>Programme qui demande un service (le navigateur).</dd>
<dt>CNIL</dt><dd>Autorité française qui veille à la protection des données personnelles.</dd>
<dt>Cookie</dt><dd>Information mémorisée par le navigateur et renvoyée au site à chaque requête.</dd>
<dt>CSS</dt><dd>Langage de mise en forme des pages.</dd>
<dt>Domaine principal</dt><dd>Nom situé juste avant l’extension (lycee-exemple.fr).</dd>
<dt>Hameçonnage</dt><dd>Fraude qui imite un site ou un message connu pour voler des informations.</dd>
<dt>HTML</dt><dd>Langage à balises qui décrit le contenu d’une page.</dd>
<dt>HTTP, HTTPS</dt><dd>Protocole du Web ; sa version chiffrée.</dd>
<dt>Hyperlien</dt><dd>Lien qui relie une page à une autre.</dd>
<dt>Index</dt><dd>Table qui associe chaque mot aux pages qui le contiennent.</dd>
<dt>Moteur de recherche</dt><dd>Service qui explore, indexe et classe les pages du Web.</dd>
<dt>Navigateur</dt><dd>Logiciel qui demande et affiche les pages du Web.</dd>
<dt>PageRank</dt><dd>Méthode de classement de Google fondée sur les liens entre pages.</dd>
<dt>RGPD</dt><dd>Règlement européen sur la protection des données personnelles.</dd>
<dt>Robot d’indexation</dt><dd>Programme qui parcourt le Web en suivant les liens.</dd>
<dt>Serveur web</dt><dd>Programme qui répond aux requêtes HTTP.</dd>
<dt>TLS</dt><dd>Protocole qui chiffre les échanges (HTTPS).</dd>
<dt>URL</dt><dd>Adresse d’une ressource du Web.</dd>
<dt>W3C</dt><dd>Organisme qui définit les standards du Web.</dd>
</dl>` });
