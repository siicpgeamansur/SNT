COURSE.push({ id: 'gps', t: 'Le GPS : localisation par satellites', h: `
<p>Le <b>GPS</b> (<i>Global Positioning System</i>) est un système américain de <b>positionnement par satellites</b>. Il appartient à la famille des <b>GNSS</b> (systèmes de navigation par satellites) : GPS (États-Unis), GLONASS (Russie), Galileo (Europe), BeiDou (Chine). Un téléphone peut en utiliser plusieurs.</p>
<h3>Trois éléments</h3>
<ul>
<li>Les <b>satellites</b>, à environ 20 000 km d’altitude, qui émettent en continu leur position et l’heure exacte (grâce à des horloges atomiques).</li>
<li>Le <b>segment de contrôle</b> au sol, qui surveille les satellites.</li>
<li>Le <b>récepteur</b> (téléphone, voiture, montre), qui ne fait que recevoir : il n’envoie rien aux satellites.</li>
</ul>
<h3>Le principe : mesurer des distances</h3>
<ol>
<li>Chaque satellite envoie un message : « je suis ici et il est telle heure ».</li>
<li>Le récepteur note l’heure d’arrivée. Le temps de trajet <i>t</i> donne la distance : <b>d = c × t</b>, avec <i>c</i> ≈ 300 000 km/s (vitesse de la lumière).</li>
<li>Connaissant sa distance à un satellite, le récepteur sait qu’il se trouve sur une sphère autour de lui.</li>
<li>L’intersection de plusieurs sphères donne la position : c’est la <b>trilatération</b>.</li>
</ol>
<p>Pour d = 20 000 km, le signal met environ 67 ms. La lumière parcourt 300 m en 1 microseconde : une erreur de 1 µs sur l’horloge donne une erreur de 300 m. Les horloges des satellites sont atomiques, ce qui est très précis, mais celle du récepteur ne l’est pas. On ajoute donc une inconnue : le décalage d’horloge du récepteur. Il y a quatre inconnues (latitude, longitude, altitude, décalage d’horloge) : il faut donc <b>au moins 4 satellites</b>.</p>
<h3>Précision</h3>
<ul>
<li>Un smartphone est précis à quelques mètres en terrain dégagé.</li>
<li>La précision diminue dans les rues étroites, en forêt et dans les bâtiments : les signaux sont masqués ou réfléchis.</li>
<li>Des systèmes d’aide (réseaux mobiles, Wi-Fi, correction différentielle) améliorent la position, parfois jusqu’au centimètre pour les usages professionnels.</li>
</ul>
<h3>Les trames NMEA</h3>
<p>Un récepteur communique souvent par phrases de texte (format NMEA), comme <code>$GPGGA,123519,4507.404,N,…*4B</code> : heure UTC, latitude, longitude, nombre de satellites, précision, altitude. Les deux derniers caractères sont une <b>somme de contrôle</b> qui permet de vérifier que la trame n’est pas altérée.</p>
<div class="retain"><b>À retenir.</b> Un récepteur calcule sa position en mesurant sa distance à au moins 4 satellites (d = c × t). Il ne transmet rien aux satellites : c’est l’application qui peut ensuite envoyer sa position sur Internet.</div>` });

COURSE.push({ id: 'coordonnees', t: 'Coordonnées géographiques', h: `
<p>Pour désigner un point sur Terre, on utilise un système de repérage fondé sur deux angles.</p>
<h3>Latitude et longitude</h3>
<ul>
<li>La <b>latitude</b> : angle nord-sud par rapport à l’<b>équateur</b>. De 0° à 90°, vers le nord (N) ou le sud (S). Les <b>parallèles</b> sont des cercles de même latitude.</li>
<li>La <b>longitude</b> : angle est-ouest par rapport au <b>méridien de Greenwich</b>. De 0° à 180°, vers l’est (E) ou l’ouest (O). Les <b>méridiens</b> relient les pôles.</li>
</ul>
<p>On écrit en <b>degrés décimaux</b> (45,1234° N) ou en <b>degrés, minutes, secondes</b> (45° 7′ 24,2″ N). 1° = 60′ et 1′ = 60″. Le signe moins désigne le sud ou l’ouest.</p>
<div class="widget" data-w="dms"></div>
<h3>Distances</h3>
<ul>
<li>1° de latitude vaut environ <b>111 km</b>, partout sur Terre.</li>
<li>1° de longitude vaut environ 111 km <b>à l’équateur</b>, mais de moins en moins vers les pôles (environ 79 km à 45° de latitude, 0 aux pôles), car les méridiens se rapprochent.</li>
<li>La <b>distance à vol d’oiseau</b> entre deux points se calcule à partir des coordonnées (formule de la haversine, sur une sphère).</li>
</ul>
<h3>Altitude</h3>
<p>La position complète comprend aussi l’<b>altitude</b>, mesurée par rapport au niveau de la mer. Elle est moins précise que la latitude et la longitude avec un GPS.</p>
<div class="retain"><b>À retenir.</b> Latitude (nord-sud, 0° à 90°) et longitude (est-ouest, 0° à 180°) repèrent un point. 1° de latitude ≈ 111 km. 1° = 60′, 1′ = 60″.</div>` });

COURSE.push({ id: 'cartes', t: 'Les cartes : échelle et représentation', h: `
<p>Une carte représente un territoire <b>réduit</b> et <b>simplifié</b> sur un plan.</p>
<h3>L’échelle</h3>
<p>L’<b>échelle</b> est le rapport entre une longueur sur la carte et la longueur réelle. Une carte au <b>1/25 000</b> : 1 cm sur la carte = 25 000 cm = 250 m sur le terrain.</p>
<ul>
<li>Petit dénominateur (1/5 000) : <b>grande échelle</b>, peu de territoire, beaucoup de détails.</li>
<li>Grand dénominateur (1/1 000 000) : <b>petite échelle</b>, grand territoire, peu de détails.</li>
<li>Sur écran, l’échelle change quand on zoome : on affiche une barre d’échelle (« 500 m »).</li>
</ul>
<h3>Projeter la Terre à plat</h3>
<p>La Terre est (presque) une sphère : la représenter sur un plan <b>déforme</b> forcément les surfaces, les distances ou les angles. Une <b>projection</b> est une méthode pour passer de la sphère au plan. Beaucoup de cartes en ligne utilisent une même projection (Web Mercator), qui conserve les angles et donc la forme locale des lieux, mais exagère les surfaces vers les pôles.</p>
<h3>Deux façons de représenter l’espace</h3>
<ul>
<li><b>Image (raster)</b> : une grille de pixels, comme une photo aérienne ou satellite.</li>
<li><b>Vecteur</b> : des objets géométriques (points, lignes, polygones) avec des attributs. Le dessin des routes se redessine à toute échelle et on peut interroger chaque objet.</li>
</ul>
<h3>Lire une carte</h3>
<ul>
<li>Légende : signification des couleurs et symboles.</li>
<li>Orientation : le nord est en haut, sauf indication contraire.</li>
<li>Lignes de niveau : elles relient des points de même altitude ; plus elles sont serrées, plus la pente est forte.</li>
</ul>
<div class="retain"><b>À retenir.</b> Échelle = rapport carte / terrain. Représenter une sphère sur un plan déforme toujours. Une carte numérique est vectorielle ou en images, et peut être interrogée.</div>` });

COURSE.push({ id: 'sig', t: 'Cartes numériques et couches', h: `
<p>Une carte numérique est construite avec un <b>système d’information géographique</b> (SIG) : un système qui stocke, traite et affiche des données <b>localisées</b>.</p>
<h3>Des couches de données</h3>
<p>Chaque <b>couche</b> regroupe des éléments du même type : routes, bâtiments, transports, cours d’eau, services, relief… On les <b>superpose</b> pour composer la carte, et chacune peut être affichée ou masquée. Chaque élément d’une couche a une <b>géométrie</b> (un point, une ligne, un polygone avec des coordonnées) et des <b>attributs</b> (nom, type, horaires…). La table d’une couche est donc une table de données comme celles de la page sur les données structurées.</p>
<h3>Le géocodage</h3>
<ul>
<li><b>Géocodage</b> : transformer une adresse (« 12 rue des Écoles ») en coordonnées (latitude, longitude).</li>
<li><b>Géocodage inverse</b> : retrouver l’adresse la plus proche de coordonnées données.</li>
</ul>
<p>Cela suppose une base d’adresses localisées, souvent des données ouvertes (en France, la Base adresse nationale).</p>
<h3>Des cartes collaboratives</h3>
<p><b>OpenStreetMap</b> (OSM) est une carte du monde créée et corrigée par des contributeurs. Les données sont libres : chacun peut les réutiliser, à condition de citer la source (licence ODbL). Beaucoup d’applications de cartes s’appuient sur OSM ou sur des données ouvertes d’institutions.</p>
<h3>Des cartes mises à jour</h3>
<ul>
<li>Données des collectivités (travaux, voies cyclables).</li>
<li>Images satellite et aériennes.</li>
<li>Signalements des utilisateurs (fermeture, accident).</li>
<li>Trajets des utilisateurs, qui permettent de détecter de nouvelles routes.</li>
</ul>
<div class="retain"><b>À retenir.</b> Une carte numérique = des couches de données localisées, chacune avec ses attributs. Le géocodage relie adresses et coordonnées. OpenStreetMap est une carte collaborative aux données libres.</div>` });

COURSE.push({ id: 'itineraire', t: 'Calculer un itinéraire', h: `
<p>Pour proposer un itinéraire, une application modélise le réseau routier par un <b>graphe pondéré</b>.</p>
<ul>
<li>Les <b>sommets</b> : carrefours, lieux.</li>
<li>Les <b>arêtes</b> : tronçons de route entre deux sommets.</li>
<li>Le <b>poids</b> d’une arête : sa longueur (km), ou mieux, sa <b>durée</b> estimée (longueur ÷ vitesse, plus le trafic).</li>
</ul>
<p>Chercher un itinéraire, c’est trouver, entre le départ et l’arrivée, le <b>chemin dont la somme des poids est minimale</b>.</p>
<h3>L’algorithme de Dijkstra</h3>
<p>Inventé en 1956 par le Néerlandais Edsger Dijkstra, il calcule les plus courts chemins depuis un sommet de départ.</p>
<ol>
<li>Distance de départ = 0 ; toutes les autres = ∞ (inconnue).</li>
<li>Choisir, parmi les sommets non fixés, celui de distance la plus petite et le <b>fixer</b> (sa distance est définitive).</li>
<li>Pour chaque voisin, regarder si passer par ce sommet donne un chemin plus court ; si oui, mettre à jour sa distance et noter d’où l’on vient.</li>
<li>Répéter jusqu’à avoir fixé l’arrivée. On remonte ensuite les « vient de » pour reconstituer l’itinéraire.</li>
</ol>
<p>L’algorithme suppose que les poids sont positifs. Les applications utilisent des variantes plus rapides (comme A*) pour des cartes qui contiennent des millions de carrefours.</p>
<h3>Plusieurs critères</h3>
<ul>
<li>Le plus court en distance n’est pas toujours le plus rapide.</li>
<li>On peut ajouter des contraintes : éviter les péages, la rocade, les routes non cyclables ; préférer les transports en commun.</li>
<li>Le poids dépend du <b>trafic</b> : l’itinéraire est recalculé en temps réel.</li>
</ul>
<div class="retain"><b>À retenir.</b> Réseau routier = graphe pondéré. Itinéraire = chemin de poids minimal, trouvé par Dijkstra ou une variante. Le meilleur trajet dépend du critère (distance, durée, contraintes) et du trafic.</div>` });

COURSE.push({ id: 'trafic', t: 'Le trafic collecté par les usagers', h: `
<p>Comment une application sait-elle qu’une route est embouteillée ?</p>
<h3>Des capteurs et des usagers</h3>
<ul>
<li>Des <b>capteurs</b> installés par les gestionnaires de routes (boucles dans la chaussée, caméras).</li>
<li>Les <b>téléphones des usagers</b> : chaque application de navigation envoie, de façon anonymisée ou non, sa position et sa vitesse. On parle de données <b>participatives</b>.</li>
</ul>
<h3>Du détail à l’ensemble</h3>
<ol>
<li>Chaque téléphone envoie des points (position, heure, vitesse).</li>
<li>Le serveur rattache chaque point à un tronçon de route.</li>
<li>Il agrège les vitesses par tronçon (moyenne ou médiane) sur les dernières minutes.</li>
<li>Il compare à la vitesse normale pour détecter un ralentissement et recalcule les durées de parcours.</li>
</ol>
<p>Plus il y a d’usagers, plus l’estimation est fiable : les erreurs individuelles se compensent. La médiane résiste mieux que la moyenne aux vitesses atypiques (piétons, cyclistes, bus, arrêts).</p>
<h3>Limites</h3>
<ul>
<li>Peu d’usagers sur une petite route la nuit : estimation peu fiable.</li>
<li>Effet inverse : si beaucoup d’usagers sont dirigés vers la même route « libre », elle se congestionne à son tour.</li>
<li>Les résultats dépendent de la qualité des données de localisation.</li>
</ul>
<div class="retain"><b>À retenir.</b> Le trafic est mesuré par des capteurs et par les positions et vitesses des usagers, agrégées par tronçon. Un grand nombre d’usagers rend l’estimation plus fiable, mais suppose de collecter leurs positions.</div>` });

COURSE.push({ id: 'donnees', t: 'Localisation et vie privée', h: `
<p>La position d’une personne est une <b>donnée personnelle</b>, et l’une des plus sensibles.</p>
<h3>Ce que révèle une trace de localisation</h3>
<ul>
<li>Le <b>domicile</b> (où l’on est la nuit) et le <b>lieu de travail ou d’études</b> (où l’on est la journée).</li>
<li>Les <b>habitudes</b> : horaires, sorties, activités régulières, lieux de culte, de soins, de loisirs.</li>
<li>Les <b>relations</b> : avec qui on se trouve au même endroit.</li>
</ul>
<p>Une étude de 2013 sur 1,5 million d’utilisateurs de téléphones portables a montré que <b>quatre points de localisation datés</b> suffisent à identifier 95 % des personnes. Une trace « anonymisée » (sans nom) peut donc être ré-identifiée.</p>
<h3>Qui collecte ?</h3>
<ul>
<li>Les applications de cartes et de navigation, mais aussi de météo, de réseaux sociaux, de jeux.</li>
<li>L’opérateur mobile (par les antennes relais).</li>
<li>Le système du téléphone, selon ses réglages.</li>
<li>Les publications elles-mêmes : photos géolocalisées, « check-in », métadonnées.</li>
</ul>
<h3>Le cadre légal</h3>
<p>Le <b>RGPD</b> s’applique : la collecte de la position doit avoir une <b>finalité précise</b>, le <b>consentement</b> clair de l’utilisateur, être limitée au <b>nécessaire</b> (minimisation) et ne pas durer plus que nécessaire. La <b>CNIL</b> contrôle son application.</p>
<h3>Se protéger</h3>
<ul>
<li>Choisir « <b>seulement quand j’utilise l’application</b> » plutôt que « toujours ».</li>
<li>Préférer une position <b>approximative</b> quand le service n’a pas besoin d’une adresse exacte.</li>
<li>Désactiver la localisation des photos, et vérifier les autorisations régulièrement.</li>
<li>Se demander : cette application a-t-elle vraiment besoin de ma position ?</li>
</ul>
<h3>À faire dans votre téléphone</h3>
<p>Ouvrez les réglages de confidentialité, rubrique « Localisation » : vous voyez la liste des applications qui ont accès à votre position et le type d’accès accordé.</p>
<div class="retain"><b>À retenir.</b> La localisation est une donnée personnelle très révélatrice : quelques points suffisent à identifier une personne. Le RGPD impose finalité, consentement et minimisation ; on choisit au mieux ses autorisations.</div>` });

COURSE.push({ id: 'mobilites', t: 'Les mobilités et le numérique', h: `
<p>Le numérique transforme la façon de se déplacer.</p>
<h3>Nouveaux services</h3>
<ul>
<li><b>Information en temps réel</b> sur les transports en commun (horaires, retards).</li>
<li><b>Mobilité partagée</b> : covoiturage, vélos et trottinettes en libre-service, autopartage.</li>
<li><b>Billetterie et paiement</b> dématérialisés, parfois un seul compte pour plusieurs moyens de transport.</li>
<li><b>Calcul d’itinéraires multimodaux</b> : combiner marche, vélo, bus et train.</li>
<li><b>Véhicules de plus en plus connectés</b> : assistance à la conduite, véhicules autonomes en expérimentation.</li>
</ul>
<h3>Intérêts</h3>
<ul>
<li>Gain de temps, fluidité, accessibilité (personnes à mobilité réduite).</li>
<li>Meilleure utilisation des véhicules et des infrastructures, possible baisse des émissions.</li>
</ul>
<h3>Questions à se poser</h3>
<ul>
<li><b>Vie privée</b> : tous ces services collectent des positions.</li>
<li><b>Dépendance</b> : que faire sans réseau ni batterie ?</li>
<li><b>Effets de bord</b> : une application qui détourne le trafic vers des petites rues peut gêner les riverains.</li>
<li><b>Inégalités</b> : tout le monde n’a pas de smartphone ni de forfait.</li>
<li><b>Environnement</b> : les services numériques consomment de l’énergie et des ressources (serveurs, satellites, appareils).</li>
</ul>
<div class="retain"><b>À retenir.</b> Le numérique facilite et réorganise les déplacements, mais pose des questions de vie privée, de dépendance et d’impact. Il faut garder un regard critique.</div>` });

COURSE.push({ id: 'limites', t: 'Ce que la page simplifie', h: `
<ul>
<li>La ville de Valmont, ses lieux, ses adresses et les trajets de Sam sont <b>fictifs</b>. Les coordonnées sont inventées.</li>
<li>La trilatération est en 2D avec des cercles ; le vrai GPS travaille en 3D avec des sphères, des horloges atomiques, des corrections d’effets atmosphériques et relativistes.</li>
<li>La distance à vol d’oiseau suppose une Terre sphérique ; la Terre est un peu aplatie.</li>
<li>Le graphe routier a 13 sommets. Dans une vraie application, il en a des centaines de millions, et l’algorithme est optimisé.</li>
<li>Les vitesses sont constantes par type de route, et « l’heure de pointe » multiplie simplement les durées par 3 autour d’un carrefour.</li>
<li>La simulation du trafic utilise 200 mesures fictives, avec un bruit fixe.</li>
<li>Les déductions sur la trace de Sam sont des cas types : une vraie analyse est plus fine.</li>
</ul>` });

COURSE.push({ id: 'glossaire', t: 'Glossaire', h: `
<dl class="gloss">
<dt>Altitude</dt><dd>Hauteur d’un point par rapport au niveau de la mer.</dd>
<dt>Attribut</dt><dd>Information associée à un élément d’une couche (nom, type…).</dd>
<dt>Couche</dt><dd>Ensemble de données localisées du même type dans un SIG.</dd>
<dt>Dijkstra (algorithme de)</dt><dd>Algorithme de calcul du plus court chemin dans un graphe pondéré.</dd>
<dt>Échelle</dt><dd>Rapport entre une longueur sur la carte et la longueur réelle.</dd>
<dt>Géocodage</dt><dd>Transformation d’une adresse en coordonnées.</dd>
<dt>GNSS</dt><dd>Système de positionnement par satellites (GPS, Galileo, GLONASS, BeiDou).</dd>
<dt>GPS</dt><dd>Système de positionnement par satellites américain.</dd>
<dt>Graphe pondéré</dt><dd>Graphe dont les arêtes portent un nombre (distance, durée).</dd>
<dt>Latitude</dt><dd>Angle nord-sud par rapport à l’équateur.</dd>
<dt>Longitude</dt><dd>Angle est-ouest par rapport au méridien de Greenwich.</dd>
<dt>NMEA</dt><dd>Format de messages texte envoyés par un récepteur GPS.</dd>
<dt>OpenStreetMap</dt><dd>Carte du monde collaborative aux données libres.</dd>
<dt>Projection</dt><dd>Méthode pour représenter la sphère terrestre sur un plan.</dd>
<dt>Raster</dt><dd>Image formée de pixels.</dd>
<dt>RGPD</dt><dd>Règlement européen sur la protection des données personnelles.</dd>
<dt>SIG</dt><dd>Système d’information géographique.</dd>
<dt>Trilatération</dt><dd>Calcul d’une position à partir de distances à des points connus.</dd>
<dt>Vecteur</dt><dd>Représentation par points, lignes et polygones avec attributs.</dd>
</dl>` });

      });

  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', { type: 'button', class: s.id === cur.id ? 'on' : '', 'aria-current': s.id === cur.id ? 'true' : 'false', onclick: () => go(s.id) }, (i + 1) + '. ' + s.t)));

  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: cur.h }));
  art.querySelectorAll('[data-w]').forEach(w => { if (w.dataset.w === 'dms') widgetDms(w); });
  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : notions de géolocalisation'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

/* ---------- aide ---------- */
function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Cinq ateliers pour comprendre la localisation, la cartographie et la mobilité (SNT, seconde). La ville de Valmont, ses lieux et ses personnages sont fictifs.</p>' +

    '<h3>Vos données</h3><p>Les réponses au QCM sont mémorisées dans ce navigateur uniquement.</p>' }));
});
