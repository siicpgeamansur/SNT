<style>

*{box-sizing:border-box}

const COURSE = [];
COURSE.push({ id: 'donnees', t: 'Donnée, information, collection', h: `
<p>Une <b>donnée</b> est une valeur brute qui décrit un fait : « 24 », « Gare Nord », « 2024-05-12 ». Prise seule, elle ne dit pas grand-chose. Une <b>information</b> est une donnée mise en contexte : « la station Gare Nord a 24 places ».</p>
<h3>Où trouve-t-on des données ?</h3>
<ul>
<li>Dans des fichiers (tableur, CSV), des bases de données, des sites web.</li>
<li>Dans les <b>capteurs</b> : GPS, thermomètres, podomètres, caméras.</li>
<li>Dans les <b>traces d’usage</b> : historique de navigation, achats, messages, « J’aime ».</li>
<li>Dans les <b>enquêtes</b> et les recensements.</li>
</ul>
<h3>Données structurées</h3>
<p>Des données sont <b>structurées</b> quand elles sont organisées de façon régulière : chaque objet est décrit par les mêmes descripteurs. Un tableau de stations en est un exemple. À l’inverse, un texte libre, une photo ou une vidéo sont des données <b>non structurées</b> (il faut des traitements particuliers pour en tirer des informations).</p>
<h3>Collection</h3>
<p>Un ensemble d’objets décrits de la même façon s’appelle une <b>collection</b> : les 24 stations de vélos, les élèves d’un lycée, les livres d’une médiathèque. On manipule une collection en la <b>filtrant</b>, la <b>triant</b>, en <b>calculant</b> dessus, en la <b>croisant</b> avec une autre.</p>
<div class="retain"><b>À retenir.</b> Donnée = valeur brute ; information = donnée avec un sens. Données structurées = mêmes descripteurs pour tous les objets d’une collection.</div>` });

COURSE.push({ id: 'table', t: 'Le tableau : enregistrements et descripteurs', h: `
<p>La façon la plus courante d’organiser des données structurées est la <b>table</b> (un tableau).</p>
<table class="ctable"><thead><tr><th>Mot</th><th>Dans le tableau</th><th>Exemple</th></tr></thead><tbody>
<tr><td><b>Enregistrement</b> (ou ligne, objet)</td><td>Une ligne</td><td>La station « Gare Nord »</td></tr>
<tr><td><b>Descripteur</b> (ou attribut, champ, colonne)</td><td>Une colonne</td><td>« places »</td></tr>
<tr><td><b>Valeur</b></td><td>Une case</td><td>10</td></tr>
</tbody></table>
<p>Une table de <i>n</i> lignes et <i>p</i> colonnes contient <i>n</i> × <i>p</i> valeurs (sans compter l’en-tête).</p>
<h3>Les types de données</h3>
<table class="ctable"><thead><tr><th>Type</th><th>Exemples</th><th>Opérations possibles</th></tr></thead><tbody>
<tr><td>Entier</td><td>42, 2024</td><td>calculs, comparaison, tri numérique</td></tr>
<tr><td>Décimal (flottant)</td><td>3.5, 14.25</td><td>calculs, comparaison</td></tr>
<tr><td>Texte (chaîne de caractères)</td><td>Gare Nord, 07 12 34 56 78</td><td>comparaison, recherche, tri alphabétique</td></tr>
<tr><td>Date</td><td>2024-05-12</td><td>comparaison, durées</td></tr>
<tr><td>Booléen</td><td>vrai / faux, oui / non</td><td>conditions</td></tr>
</tbody></table>
<ul>
<li>Un <b>code</b> ou un <b>numéro de téléphone</b> est du texte : on n’additionne pas des téléphones et les zéros au début comptent.</li>
<li>Dans une colonne, toutes les valeurs doivent avoir le <b>même type</b>.</li>
<li>Une <b>valeur manquante</b> est une case vide : il faut décider comment la traiter.</li>
</ul>
<p>Une bonne table est <b>propre</b> : mêmes écritures pour une même chose (« Gare » partout, pas « gare » ni « GARE »), mêmes formats de dates, pas de lignes à moitié remplies.</p>
<div class="retain"><b>À retenir.</b> Ligne = enregistrement, colonne = descripteur, case = valeur. Chaque colonne a un type qui détermine les traitements possibles.</div>` });

COURSE.push({ id: 'formats', t: 'Formats de fichiers : CSV et JSON', h: `
<p>Pour stocker et échanger des données, on les écrit dans un fichier. Voici deux formats texte très répandus, lisibles par l’humain et par les programmes.</p>
<h3>CSV</h3>
<p>Une ligne par enregistrement, les valeurs séparées par un caractère : la virgule, le point-virgule ou la tabulation. La première ligne contient les noms des descripteurs.</p>
<pre class="code">nom;places;electrique
Gare Nord;10;oui
Marina;20;non</pre>
<ul>
<li>Le séparateur ne doit pas apparaître dans une valeur, sinon il faut mettre la valeur entre <b>guillemets</b>.</li>
<li>Dans les pays où la virgule est la marque décimale (comme la France), on utilise souvent le point-virgule comme séparateur : sinon 14,5 serait lu comme deux valeurs.</li>
<li>Le CSV s’ouvre dans un tableur et se lit facilement par programme.</li>
</ul>
<h3>JSON</h3>
<p>Le <b>JSON</b> décrit des objets sous forme de paires « clé : valeur » entre accolades, et des listes entre crochets. Il est très utilisé pour échanger des données entre sites et applications.</p>
<pre class="code">[
  { "nom": "Gare Nord", "places": 10, "electrique": "oui" },
  { "nom": "Marina", "places": 20, "electrique": "non" }
]</pre>
<p>Essayez de passer d’un format à l’autre :</p>
<div class="widget" data-w="csv"></div>
<h3>Autres formats</h3>
<ul>
<li><b>XML</b> : balises imbriquées, comme le HTML, utilisé pour des échanges de données.</li>
<li><b>Fichiers de tableur</b> (xlsx, ods) : des tableaux avec mise en forme et formules.</li>
<li><b>Bases de données</b> : pour de grands volumes (voir la section dédiée).</li>
</ul>
<div class="retain"><b>À retenir.</b> CSV : lignes et séparateurs, simple, très répandu. JSON : objets « clé : valeur » et listes. Un format standard permet à des logiciels différents d’échanger des données.</div>` });

COURSE.push({ id: 'traitement', t: 'Rechercher, trier, filtrer', h: `
<p>Traiter des données, c’est d’abord les interroger. Trois opérations de base :</p>
<h3>Rechercher</h3>
<p>Retrouver une valeur ou un enregistrement dans la collection. On peut chercher une valeur exacte (« Marina ») ou contenant un motif (« gare »).</p>
<h3>Filtrer (sélectionner)</h3>
<p>Ne garder que les lignes qui vérifient une <b>condition</b>.</p>
<ul>
<li>Conditions simples : égal à, différent de, supérieur à, inférieur à, contient.</li>
<li>On combine avec <b>ET</b> (toutes vraies) ou <b>OU</b> (au moins une vraie).</li>
<li>Exemple : électrique = « non » ET vélos dispo ≥ 10.</li>
</ul>
<h3>Trier</h3>
<p>Ordonner les lignes selon un ou plusieurs <b>critères</b> (croissant ou décroissant). Le second critère sert à départager les égalités du premier.</p>
<ul>
<li>Les nombres sont triés par valeur ; les textes, par ordre alphabétique (selon le code des caractères : les lettres accentuées majuscules peuvent passer à la fin).</li>
<li>Trier ne change pas les données : seulement leur ordre d’affichage.</li>
</ul>
<h3>Et dans un tableur ?</h3>
<p>Ces opérations sont disponibles dans les fonctions « trier », « filtrer » et « rechercher ». En programmation, on les écrit avec des boucles et des conditions, en parcourant la liste des enregistrements.</p>
<div class="retain"><b>À retenir.</b> Filtrer = sélectionner des lignes selon une condition. Trier = ordonner selon un ou plusieurs critères. Rechercher = retrouver une valeur.</div>` });

COURSE.push({ id: 'calculs', t: 'Calculs et statistiques', h: `
<p>Pour résumer une collection, on calcule des <b>indicateurs</b>.</p>
<table class="ctable"><thead><tr><th>Indicateur</th><th>Définition</th><th>Exemple (3, 4, 4, 5, 5, 6, 40)</th></tr></thead><tbody>
<tr><td>Effectif</td><td>Nombre de lignes</td><td>7</td></tr>
<tr><td>Somme</td><td>Total des valeurs</td><td>67</td></tr>
<tr><td>Moyenne</td><td>Somme ÷ effectif</td><td>67 ÷ 7 ≈ 9,57</td></tr>
<tr><td>Minimum, maximum</td><td>Plus petite et plus grande valeur</td><td>3 et 40</td></tr>
<tr><td>Médiane</td><td>Valeur qui partage la série triée en deux moitiés</td><td>5</td></tr>
</tbody></table>
<h3>Regrouper</h3>
<p>On peut calculer <b>par groupe</b> : par quartier, par année, par classe. On regroupe les lignes qui ont la même valeur dans un descripteur, puis on calcule un indicateur pour chaque groupe.</p>
<h3>Moyenne ou médiane ?</h3>
<p>La moyenne est sensible aux <b>valeurs extrêmes</b> : une seule valeur très grande la tire vers le haut (ici 9,57, alors que six valeurs sur sept sont entre 3 et 6). La médiane y résiste mieux.</p>
<h3>Interpréter avec prudence</h3>
<ul>
<li>Un petit groupe (6 stations) donne une moyenne peu fiable.</li>
<li>Deux groupes différents peuvent s’expliquer par un <b>troisième facteur</b> (le quartier, par exemple).</li>
<li>Une <b>corrélation</b> (deux valeurs qui varient ensemble) ne prouve pas une <b>causalité</b> (l’une provoque l’autre).</li>
<li>Vérifier les <b>valeurs manquantes</b> et les <b>erreurs de saisie</b> avant de calculer.</li>
</ul>
<div class="retain"><b>À retenir.</b> Effectif, somme, moyenne, min, max, médiane. On peut regrouper pour calculer par catégorie. Une moyenne n’est pas toujours représentative ; corrélation ≠ causalité.</div>` });

COURSE.push({ id: 'croiser', t: 'Croiser des tables : clés et jointures', h: `
<p>Quand une information concerne plusieurs objets (le club d’un élève, l’auteur d’un livre), la répéter à chaque ligne crée des <b>redondances</b> : de la place perdue, et des risques d’incohérence à la moindre modification. On préfère mettre cette information dans <b>une autre table</b>.</p>
<h3>Clé primaire et clé étrangère</h3>
<ul>
<li>La <b>clé primaire</b> est un descripteur dont la valeur identifie de façon <b>unique</b> chaque enregistrement (par exemple <code>id_club</code>).</li>
<li>Une <b>clé étrangère</b> est un descripteur dont les valeurs sont des clés primaires d’une autre table (la colonne <code>club</code> de la table des élèves).</li>
</ul>
<h3>La jointure</h3>
<p>Une <b>jointure</b> associe chaque ligne d’une table aux lignes d’une autre qui ont la même valeur de clé. On obtient un tableau plus complet, sans avoir répété les données.</p>
<h3>Qualité des données</h3>
<ul>
<li>Une clé étrangère vide ou qui renvoie à une clé inexistante est une erreur d’<b>intégrité</b> : la ligne ne trouve pas de correspondance.</li>
<li>Une modification (changer la salle d’un club) ne se fait qu’à un seul endroit.</li>
<li>Croiser des tables d’origines différentes (par exemple, des données publiques et des données privées) peut <b>révéler des informations sur des personnes</b> (voir la section sur la protection).</li>
</ul>
<div class="retain"><b>À retenir.</b> Clé primaire = identifiant unique d’une ligne. Clé étrangère = renvoi vers la clé primaire d’une autre table. La jointure relie les tables et évite les redondances.</div>` });

COURSE.push({ id: 'bases', t: 'Bases de données', h: `
<p>Quand les données sont nombreuses, partagées par beaucoup d’utilisateurs et modifiées en permanence, un simple fichier ne suffit plus. On utilise une <b>base de données</b>, gérée par un <b>système de gestion de base de données</b> (SGBD).</p>
<h3>Ce que fait un SGBD</h3>
<ul>
<li>Stocker les données dans plusieurs tables reliées.</li>
<li>Permettre à plusieurs utilisateurs d’y accéder en même temps sans conflit.</li>
<li>Garantir la <b>cohérence</b> (une clé étrangère ne doit pas être orpheline) et la <b>sécurité</b> (qui a le droit de lire ou modifier).</li>
<li>Répondre rapidement à des <b>requêtes</b>, grâce à des index.</li>
</ul>
<h3>Une requête</h3>
<p>Un langage répandu est le SQL. Cette requête filtre et trie les stations de l’atelier :</p>
<pre class="code">SELECT nom, usage
FROM stations
WHERE quartier = 'Gare' AND usage > 100
ORDER BY usage DESC;</pre>
<p>On retrouve les trois idées vues dans les ateliers : choisir des colonnes, filtrer avec une condition, trier.</p>
<h3>Exemples d’usage</h3>
<ul>
<li>Un site marchand (produits, clients, commandes).</li>
<li>Un réseau social (profils, publications, relations).</li>
<li>L’ENT du lycée (élèves, classes, notes).</li>
</ul>
<h3>Données massives (big data)</h3>
<p>Quand le volume, la vitesse d’arrivée et la variété des données dépassent les outils ordinaires (milliards de lignes, capteurs en continu), on parle de <b>données massives</b>. On les traite en répartissant le travail sur de nombreux ordinateurs (cloud, centres de données).</p>
<div class="retain"><b>À retenir.</b> Une base de données regroupe des tables reliées, gérées par un SGBD qui garantit accès partagé, cohérence et sécurité. On l’interroge par des requêtes (filtrer, trier, joindre).</div>` });

COURSE.push({ id: 'metadonnees', t: 'Métadonnées', h: `
<p>Les <b>métadonnées</b> sont des données qui décrivent d’autres données.</p>
<table class="ctable"><thead><tr><th>Objet</th><th>Données</th><th>Métadonnées possibles</th></tr></thead><tbody>
<tr><td>Photo</td><td>Les pixels</td><td>Date et heure, position GPS, appareil, réglages</td></tr>
<tr><td>Document</td><td>Le texte</td><td>Auteur, dates de création et de modification, logiciel</td></tr>
<tr><td>Message</td><td>Le contenu</td><td>Expéditeur, destinataire, heure, taille</td></tr>
<tr><td>Fichier musical</td><td>Le son</td><td>Titre, artiste, album, année</td></tr>
</tbody></table>
<h3>À quoi servent-elles ?</h3>
<ul>
<li>Classer et <b>retrouver</b> des contenus (par date, par lieu, par auteur).</li>
<li>Savoir d’où vient un document et si on peut lui faire confiance.</li>
<li>Faire fonctionner des services (cartes de photos, recommandations).</li>
</ul>
<h3>Quels risques ?</h3>
<p>Les métadonnées sont ajoutées automatiquement et on les oublie. Pourtant, une photo peut révéler où et quand elle a été prise, un document qui l’a écrit. En croisant les métadonnées de plusieurs fichiers, on reconstitue des habitudes de vie. Même sans lire le contenu des messages, savoir <b>qui écrit à qui, quand et combien</b> en dit beaucoup.</p>
<h3>Que faire ?</h3>
<ul>
<li>Désactiver la <b>localisation</b> de l’appareil photo si on partage des photos.</li>
<li>Supprimer les métadonnées avant de diffuser un fichier (des outils le permettent).</li>
<li>Savoir que la plupart des réseaux sociaux les retirent à l’affichage, mais ne le font pas toujours.</li>
</ul>
<div class="retain"><b>À retenir.</b> Les métadonnées décrivent les données. Utiles pour classer et retrouver, elles peuvent révéler lieu, date, appareil, relations : il faut y faire attention avant de partager un fichier.</div>` });

COURSE.push({ id: 'opendata', t: 'Collecte et données ouvertes', h: `
<h3>Comment les données sont-elles collectées ?</h3>
<ul>
<li>Saisie par des personnes (formulaires, enquêtes).</li>
<li>Mesures automatiques par des <b>capteurs</b> (météo, circulation, vélos disponibles).</li>
<li>Traces numériques des utilisateurs (navigation, achats, applications).</li>
</ul>
<p>La qualité du résultat dépend de la qualité des données collectées : des erreurs, des oublis ou des biais (qui a répondu ?) se retrouvent dans les conclusions.</p>
<h3>Données ouvertes (open data)</h3>
<p>Les <b>données ouvertes</b> sont des données publiques mises à disposition de tous, gratuitement, dans des formats réutilisables (CSV, JSON), avec une licence qui autorise leur réutilisation. Les collectivités et l’État en publient : horaires de transports, qualité de l’air, budgets, stations de vélos en libre-service, résultats d’élections. En France, le portail national est data.gouv.fr.</p>
<ul>
<li><b>Intérêts</b> : transparence, innovation (applications de transport), recherche, journalisme de données.</li>
<li><b>Limites</b> : qualité inégale, mises à jour variables, risque de ré-identification si des données personnelles mal anonymisées sont publiées.</li>
</ul>
<h3>Utiliser des données avec esprit critique</h3>
<ul>
<li>Qui a produit ces données ? Quand ? Dans quel but ?</li>
<li>Comment ont-elles été collectées ? Sur combien de personnes ?</li>
<li>Y a-t-il des valeurs manquantes, des doublons, des erreurs ?</li>
<li>Les conclusions sont-elles justifiées par les chiffres, ou simplement suggérées ?</li>
</ul>
<div class="retain"><b>À retenir.</b> Les données sont collectées par saisie, capteurs et traces numériques. L’open data met des données publiques à disposition de tous. Il faut toujours en vérifier la source et la qualité.</div>` });

COURSE.push({ id: 'protection', t: 'Protection des données et anonymisation', h: `
<h3>Données personnelles</h3>
<p>Une <b>donnée personnelle</b> est une information qui permet d’identifier une personne, directement (nom, photo, numéro de sécurité sociale) ou indirectement par recoupement (âge, ville, établissement, plaque d’immatriculation).</p>
<h3>Le RGPD</h3>
<p>Le <b>règlement général sur la protection des données</b> (RGPD) s’applique dans toute l’Union européenne. La <b>CNIL</b> en assure le contrôle en France. Il impose notamment :</p>
<ul>
<li>un <b>but précis</b> pour toute collecte (finalité) ;</li>
<li>de ne collecter que le <b>nécessaire</b> (minimisation) ;</li>
<li>une <b>durée de conservation</b> limitée ;</li>
<li>le <b>consentement</b> clair pour certains usages ;</li>
<li>des <b>droits</b> pour chacun : être informé, accéder à ses données, les rectifier, demander leur effacement, s’opposer.</li>
</ul>
<h3>Anonymiser, est-ce suffisant ?</h3>
<p>Retirer les noms ne suffit pas toujours. Si des descripteurs restants (âge, ville, sexe, profession) forment une combinaison <b>unique</b>, quelqu’un qui connaît ces informations peut retrouver la ligne : c’est la <b>ré-identification</b>. Plus il y a de descripteurs, plus c’est probable.</p>
<p>Pour l’éviter, on <b>généralise</b> les valeurs (âge exact → tranche d’âge ; ville → région), on supprime les lignes trop rares ou certaines colonnes. On vise des groupes d’au moins <i>k</i> personnes identiques. L’atelier 5 montre le compromis : plus on généralise, plus on protège, mais moins les données sont précises et utiles.</p>
<h3>Bonnes pratiques</h3>
<ul>
<li>Ne pas collecter plus que nécessaire.</li>
<li>Ne pas publier des données sur des personnes sans leur accord.</li>
<li>Savoir que des jeux de données séparés, une fois croisés, peuvent identifier quelqu’un.</li>
</ul>
<div class="retain"><b>À retenir.</b> Le RGPD protège les données personnelles (finalité, minimisation, droits). Anonymiser en retirant les noms ne suffit pas : une combinaison unique de valeurs permet de ré-identifier une personne.</div>` });

COURSE.push({ id: 'limites', t: 'Ce que la page simplifie', h: `
<ul>
<li>Les stations, les élèves, les clubs, les photos et les fichiers sont <b>fictifs</b>. Les 24 stations sont générées de façon fixe pour que les résultats soient reproductibles.</li>
<li>Le filtre accepte plusieurs conditions reliées uniquement par « ET ». Le « OU » n’est pas proposé.</li>
<li>La jointure de l’atelier 4 est une jointure simple entre deux tables de quelques lignes. Un vrai SGBD gère des millions de lignes, plusieurs types de jointures et des index.</li>
<li>Le tri des textes suit le code des caractères : une vraie application tient compte de la langue (accents, majuscules).</li>
<li>L’anonymisation n’étudie que trois descripteurs. Dans la réalité, les risques de ré-identification sont plus étendus.</li>
<li>Les chiffres statistiques portent sur de très petits échantillons : ils servent à comprendre les calculs, pas à tirer des conclusions.</li>
</ul>` });

COURSE.push({ id: 'glossaire', t: 'Glossaire', h: `
<dl class="gloss">
<dt>Anonymisation</dt><dd>Suppression ou transformation des données pour qu’on ne puisse plus identifier les personnes.</dd>
<dt>Base de données</dt><dd>Ensemble organisé de tables reliées, géré par un SGBD.</dd>
<dt>Clé étrangère</dt><dd>Descripteur dont les valeurs renvoient à la clé primaire d’une autre table.</dd>
<dt>Clé primaire</dt><dd>Descripteur qui identifie de façon unique chaque enregistrement.</dd>
<dt>Collection</dt><dd>Ensemble d’objets décrits par les mêmes descripteurs.</dd>
<dt>CSV</dt><dd>Format texte où les valeurs d’une ligne sont séparées par un caractère.</dd>
<dt>Descripteur</dt><dd>Propriété décrite pour chaque objet (colonne d’une table).</dd>
<dt>Donnée</dt><dd>Valeur brute qui décrit un fait.</dd>
<dt>Données ouvertes</dt><dd>Données publiques accessibles et réutilisables par tous.</dd>
<dt>Enregistrement</dt><dd>Ligne d’une table, qui décrit un objet.</dd>
<dt>Filtre</dt><dd>Sélection des lignes qui vérifient une condition.</dd>
<dt>Jointure</dt><dd>Association de lignes de deux tables ayant la même valeur de clé.</dd>
<dt>JSON</dt><dd>Format texte d’objets « clé : valeur » et de listes.</dd>
<dt>Médiane</dt><dd>Valeur qui partage une série ordonnée en deux moitiés.</dd>
<dt>Métadonnées</dt><dd>Données qui décrivent d’autres données.</dd>
<dt>Ré-identification</dt><dd>Retrouver l’identité d’une personne dans des données anonymisées.</dd>
<dt>RGPD</dt><dd>Règlement européen sur la protection des données personnelles.</dd>
<dt>SGBD</dt><dd>Système de gestion de base de données.</dd>
<dt>Table</dt><dd>Tableau de données : des lignes (enregistrements) et des colonnes (descripteurs).</dd>
<dt>Tri</dt><dd>Ordonnancement des lignes selon un ou plusieurs critères.</dd>
<dt>Valeur manquante</dt><dd>Case vide dans un tableau.</dd>
</dl>` });
/*COURSE-END*/

/* ---------- interface ---------- */
const UI = { cur: 'd1' };
const AS = { key: 'd1', tab: 'steps', open: false, st: lsGet(KEYS.act, {}), arm: null };
const CS = { open: false, id: 'web' };
function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }

function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': w.id === UI.cur ? 'true' : 'false', 'aria-selected': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id) }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');
  $('#hint').textContent = w.hint; root.innerHTML = '';
  w.mount(root);
  const sc = $('#scroller'); if (sc) sc.scrollTop = 0;
}
function gotoWs(id) {
  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}

function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open; box.classList.toggle('sheet', AS.open && isSmall());
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
box.dataset.k = tag;
  box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', null, (i + 1) + '. ' + q.q));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', null, o + (good ? '  ✓' : '') + (bad ? '  ✗' : ''))));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why' }, (miss ? 'Sans réponse. ' : '') + q.w)); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
box.append(body); body.scrollTop = keep;
}
function actToggle() {
  if (CS.open) { CS.open = false; renderCourse(); }
  AS.open = !AS.open; renderAct();
}
$('#bAct').addEventListener('click', actToggle);

/* ---------- cours ---------- */
function widgetCsv(root) {
  const ta = h('textarea', { class: 'code-in', rows: 4, spellcheck: 'false', 'aria-label': 'Fichier CSV' }); ta.value = 'nom;places;electrique\nGare Nord;10;oui\nMarina;20;non';
  const out = h('pre', { class: 'code' });
  const upd = () => { const p = csvParse(ta.value, ';'); out.textContent = JSON.stringify(p.rows, null, 2) + (p.bad.length ? '\n// ligne(s) ignorée(s) : ' + p.bad.join(', ') : ''); };
  ta.addEventListener('input', upd); upd();
  root.append(h('label', { class: 'fld' }, h('span', null, 'CSV (séparateur « ; »)'), ta), out);
}

function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }
function renderCourse() {
  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false'); btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;
  if (!CS.open) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);
  const go = id => { CS.id = id; renderCourse(); };
  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', { type: 'button', class: s.id === cur.id ? 'on' : '', 'aria-current': s.id === cur.id ? 'true' : 'false', onclick: () => go(s.id) }, (i + 1) + '. ' + s.t)));
  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: cur.h }));
  art.querySelectorAll('[data-w]').forEach(w => { if (w.dataset.w === 'csv') widgetCsv(w); });
  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : notions des données'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

/* ---------- aide ---------- */
function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Cinq ateliers pour comprendre les données structurées et leur traitement (SNT, seconde). Les stations, élèves, photos et fichiers sont fictifs.</p>' +
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut.</li><li>Le bouton <b>Activité</b> affiche les consignes, un défi et un QCM avec correction.</li><li>Le bouton <b>Cours</b> détaille toutes les notions.</li></ul>' +
    '<h3>Vos données</h3><p>Les réponses au QCM sont mémorisées dans ce navigateur uniquement.</p>' }));
});

/* ---------- démarrage ---------- */
(function init() {
    AS.open = !isSmall();
  renderSeg(); mountWs(); renderAct(); renderCourse();
})();

</script>
