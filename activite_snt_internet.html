/* ---------- terminal ---------- */
function lineEl(l) { return h('div', { class: l.c || '' }, l.t); }
function termPrint(n, text, cls) {
  const R = rt(n); if (!R) return; const T = R.term;
  if (text === '\f') { T.lines.length = 0; if (UI.termOut && UI.termNode === n.id) UI.termOut.innerHTML = ''; return; }
  T.lines.push({ t: text, c: cls }); if (T.lines.length > 500) T.lines.shift();
  if (UI.termOut && UI.termNode === n.id && UI.termOut.isConnected) { UI.termOut.append(lineEl({ t: text, c: cls })); UI.termOut.scrollTop = 1e9; }
}
function termUI(n) {
  const T = rt(n).term, prm = n.name.toLowerCase().replace(/\s+/g, '-') + ':~$';
  if (!T.lines.length) T.lines.push({ t: 'Terminal de ' + n.name + '. Tapez « aide » pour la liste des commandes.', c: 'dim' });
  const out = h('div', { class: 'tout', role: 'log', 'aria-live': 'polite' });
  T.lines.forEach(l => out.append(lineEl(l)));
  const input = h('input', { type: 'text', autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', 'aria-label': 'Commande' });
  const stop = h('button', { class: 'btn sm', type: 'button', hidden: !T.busy, onclick: () => { if (T.tok) T.tok.cancel = true; T.busy = false; stop.hidden = true; termPrint(n, '^C', 'dim'); } }, 'Stop');
  const form = h('form', { class: 'tin' }, h('span', { class: 'prm' }, prm), input, stop);
  form.addEventListener('submit', ev => {
    ev.preventDefault(); if (T.busy) return;
    const v = input.value; input.value = ''; termPrint(n, prm + ' ' + v, 'cmd'); if (!v.trim()) return;
    T.hist.push(v); T.hi = T.hist.length; T.busy = true; stop.hidden = false;
    const tok = { cancel: false }; T.tok = tok;
    runCommand(n, v, (t, c) => { if (!tok.cancel) termPrint(n, t, c); }, tok).catch(e => termPrint(n, 'Erreur : ' + e.message, 'err')).finally(() => { if (T.tok === tok) { T.busy = false; T.tok = null; } stop.hidden = true; });
  });
  input.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowUp' && T.hist.length) { ev.preventDefault(); T.hi = Math.max(0, T.hi - 1); input.value = T.hist[T.hi] || ''; }
    else if (ev.key === 'ArrowDown') { ev.preventDefault(); T.hi = Math.min(T.hist.length, T.hi + 1); input.value = T.hist[T.hi] || ''; }
    else if (ev.key === 'c' && ev.ctrlKey && T.tok) { T.tok.cancel = true; T.busy = false; stop.hidden = true; termPrint(n, '^C', 'dim'); }
  });
  UI.termOut = out; UI.termNode = n.id; setTimeout(() => { out.scrollTop = 1e9; if (!(window.matchMedia && matchMedia('(pointer:coarse)').matches)) input.focus(); }, 0);
  return h('div', { class: 'term' }, out, form);
}

/* ---------- browser ---------- */
function renderHtml(html, onLink) {
  const doc = new DOMParser().parseFromString(html, 'text/html'), out = document.createElement('div');
  const ok = new Set(['H1', 'H2', 'H3', 'H4', 'P', 'A', 'B', 'I', 'U', 'STRONG', 'EM', 'UL', 'OL', 'LI', 'BR', 'DIV', 'SPAN', 'HR', 'TABLE', 'TR', 'TD', 'TH', 'THEAD', 'TBODY', 'PRE', 'CODE', 'SMALL', 'BLOCKQUOTE']);
  (function walk(src, dst) {
    for (const c of src.childNodes) {
      if (c.nodeType === 3) dst.append(c.textContent);
      else if (c.nodeType === 1) {
        const t = c.tagName; if (['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'TITLE'].includes(t)) continue;
        if (ok.has(t)) {
          const e = document.createElement(t.toLowerCase());
          if (t === 'A') { const href = c.getAttribute('href') || ''; e.setAttribute('href', '#'); e.addEventListener('click', ev => { ev.preventDefault(); onLink(href); }); }
          walk(c, e); dst.append(e);
        } else walk(c, dst);
      }
    }
  })(doc.body, out);
  return out;
}
function browserUI(n) {
  const B = rt(n).br;
  const url = h('input', { type: 'text', class: 'mono', value: B.url || '', placeholder: 'http://www.exemple.fr/', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', 'aria-label': 'Adresse' });
  const st = h('div', { class: 'bstat' }, B.status || 'Saisissez un nom de domaine ou une adresse IP.'), view = h('div', { class: 'page' });
  const show = () => { view.innerHTML = ''; if (B.html != null) view.append(renderHtml(B.html, href => go(link(href)))); };
  const link = href => { const m = /^http:\/\/([^\/?#]+)/i.exec(B.url || ''); if (/^http:\/\//i.test(href)) return href; if (!m) return href; return 'http://' + m[1] + (href.startsWith('/') ? href : '/' + href); };
  async function go(u) {
    if (!u.trim()) return; url.value = u; B.url = u; B.status = 'Chargement…'; B.html = null; st.textContent = B.status; show();
    const r = await httpGet(n, u, s => { B.status = s; if (st.isConnected) st.textContent = s; });
    if (r.ok) { B.url = 'http://' + r.host + r.path; B.html = r.body; B.status = r.status + ' : reçu de ' + r.ip; }
    else { B.html = '<h2>Impossible d’afficher la page</h2><p>' + esc(r.err) + '</p>'; B.status = 'Erreur : ' + r.err; }
    if (view.isConnected) { url.value = B.url; st.textContent = B.status; show(); }
  }
  const form = h('form', { class: 'bar-url' }, url, h('button', { class: 'btn pri', type: 'submit' }, 'Aller'));
  form.addEventListener('submit', ev => { ev.preventDefault(); go(url.value); });
  show(); return [form, st, view];
}

/* ---------- data exchange ---------- */
const PKNAME = { arp: 'ARP', icmp: 'ICMP', dns: 'DNS / UDP', dhcp: 'DHCP', tcp: 'TCP', http: 'HTTP', mail: 'SMTP / POP3' };
function fmtTime(t) { const d = new Date(t); return d.toTimeString().slice(0, 8) + '.' + String(d.getMilliseconds()).padStart(3, '0'); }
function layersOf(f) {
  const L = { app: [], tr: [], net: [], link: [] };
  L.link = [['MAC source', f.src], ['MAC destination', f.dst === BCAST ? f.dst + ' (diffusion)' : f.dst], ['Type', f.type === 'ARP' ? 'ARP (0x0806)' : 'IPv4 (0x0800)']];
  if (f.type === 'ARP') { const a = f.p; L.net = [['Protocole', 'ARP'], ['Opération', a.op === 'request' ? 'Requête : qui a cette adresse IP ?' : 'Réponse'], ['MAC émetteur', a.sha], ['IP émetteur', a.spa], ['MAC cible', a.op === 'request' ? '00:00:00:00:00:00 (inconnue)' : a.tha], ['IP cible', a.tpa]]; return L; }
  const p = f.p; L.net = [['IP source', p.src], ['IP destination', p.dst], ['TTL', p.ttl], ['Protocole', p.proto]];
  if (p.proto === 'ICMP') { const d = p.data; L.net.push(['Message ICMP', d.type === 8 ? 'Demande d’écho (type 8)' : d.type === 0 ? 'Réponse d’écho (type 0)' : d.type === 11 ? 'TTL expiré (type 11)' : 'Destination inaccessible (type 3)']); if (d.seq != null) L.net.push(['Identifiant / séquence', d.id + ' / ' + d.seq]); }
  else if (p.proto === 'UDP') {
    const u = p.data, a = u.data; L.tr = [['Protocole', 'UDP'], ['Port source', u.sport], ['Port destination', u.dport]];
    if (a && a.kind === 'DNS') { L.app = [['Protocole', 'DNS'], ['Message', a.qr === 0 ? 'Requête' : 'Réponse'], ['Nom', a.qname], ['Type', 'A (adresse IPv4)']]; if (a.qr === 1) L.app.push(['Réponse', a.rcode === 0 ? a.answer : 'Introuvable (NXDOMAIN)']); }
    else if (a && a.kind === 'DHCP') { L.app = [['Protocole', 'DHCP'], ['Message', a.msg], ['MAC du client', a.chaddr]]; if (a.yiaddr) L.app.push(['Adresse proposée', a.yiaddr]); if (a.mask && a.msg === 'OFFER') L.app.push(['Masque', a.mask], ['Passerelle', a.gw || '-'], ['Serveur DNS', a.dns || '-']); }
  } else {
    const t = p.data; L.tr = [['Protocole', 'TCP'], ['Port source', t.sport], ['Port destination', t.dport], ['Drapeaux', t.flags.join(' ')], ['Numéro de séquence', t.seq]]; if (t.flags.includes('ACK')) L.tr.push(['Accusé (ack)', t.ack]);
    if (t.payload) L.app = [['Protocole', t.payload.kind], ['Message', t.payload.text]];
  }
  return L;
}
function detailEl(e) {
  const L = layersOf(e.frame), box = h('div');
  const mk = (title, sub, rows) => h('div', { class: 'layer' + (rows.length ? '' : ' empty') }, h('h4', null, title, h('span', null, sub)), rows.length ? h('dl', { class: 'kv' }, rows.map(r => [h('dt', null, r[0]), h('dd', null, String(r[1]))])) : h('div', { class: 'kv' }, 'Pas d’en-tête à cette couche'));
  box.append(mk('Couche application', 'DNS, DHCP, HTTP', L.app), mk('Couche transport', 'TCP, UDP', L.tr), mk('Couche internet', 'IP, ICMP, ARP', L.net), mk('Couche liaison', 'Ethernet', L.link));
  if (e.note) box.prepend(h('p', { class: 'small' }, e.note));
  return box;
}
function exRow(n, e, detail) {
  const i = ifaceById(n, e.iface), nb = i && neighbor(n, i);
  const tr = h('tr', { 'data-pk': e.d.pk, 'data-no': e.no, class: e.note ? 'ign' : '' }, h('td', null, e.no), h('td', null, fmtTime(e.t)), h('td', null, e.dir === 'in' ? '← ' : '→ ', nb ? nb.name : ''), h('td', null, e.d.src), h('td', null, e.d.dst), h('td', { style: 'color:var(--c-' + e.d.pk + ');font-weight:500' }, e.d.proto), h('td', { class: 'info' }, e.d.info));
  tr.addEventListener('click', () => { UI.exSel = e.no; UI.exTbody.querySelectorAll('tr.sel').forEach(x => x.classList.remove('sel')); tr.classList.add('sel'); detail.innerHTML = ''; detail.append(detailEl(e)); });
  return tr;
}
let exDetail = null;
function exAppend(n, e) { const tb = UI.exTbody; if (!tb || !tb.isConnected) return; const sc = tb.parentElement.parentElement; const bottom = sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 30; tb.append(exRow(n, e, exDetail)); if (bottom) sc.scrollTop = sc.scrollHeight; }
function exchangeUI(n) {
  const R = rt(n), detail = h('div', { class: 'detail' }); exDetail = detail;
  const tb = h('tbody'); UI.exTbody = tb; UI.exSel = null;
  R.log.forEach(e => tb.append(exRow(n, e, detail)));
  const clear = h('button', { class: 'btn sm', type: 'button', onclick: () => { R.log.length = 0; tb.innerHTML = ''; detail.innerHTML = ''; detail.append(h('p', { class: 'small' }, 'Cliquez sur une ligne pour voir les en-têtes de chaque couche.')); } }, 'Effacer');
  const legend = h('div', { class: 'legend' }, Object.keys(PKNAME).map(k => h('span', null, h('i', { style: 'background:var(--c-' + k + ')' }), PKNAME[k])));
  const sc = h('div', { class: 'tscroll' }, h('table', { class: 'tbl' }, h('thead', null, h('tr', null, ['N°', 'Heure', 'Sens, voisin', 'Source', 'Destination', 'Protocole', 'Informations'].map(x => h('th', null, x)))), tb));

  setTimeout(() => { sc.scrollTop = sc.scrollHeight; }, 0);

}
function loadText(txt) {

  UI.sel = null; UI.simNode = null; UI.tool = 'select'; UI.link = null; syncChrome(); touch(); renderPanel(); closeDlg(); return true;
}

  ({ cables: exampleCables, lan: exampleLan, router: exampleRouter, internet: exampleInternet, mail: exampleMail, modem: exampleModem })[k](); UI.sel = null; UI.simNode = null; UI.tool = 'select'; syncChrome(); touch(); renderPanel(); actSet(k, true);

  clearTimeout(newArmed); newArmed = null; b.textContent = 'Nouveau';
  if (UI.mode === 'sim') { stopSim(); UI.mode = 'design'; }

$('#bSave').addEventListener('click', () => {

});
$('#bOpen').addEventListener('click', () => {
  const ta = h('textarea', { rows: 9, class: 'mono', placeholder: 'Collez ici le contenu d’un fichier reseau.json', 'aria-label': 'Contenu à charger' });

  file.addEventListener('change', () => { const f = file.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { ta.value = String(r.result); }; r.readAsText(f); });
  openDlg('Ouvrir un réseau', h('div', null, h('p', null, 'Choisissez un fichier .json ou collez son contenu.'), file, h('div', { style: 'height:8px' }), ta), [h('button', { class: 'btn pri', type: 'button', onclick: () => ta.value.trim() ? loadText(ta.value) : toast('Rien à charger') }, 'Charger')]);

$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Reproduction en une page des fonctions principales de Filius, pour étudier le fonctionnement d’un réseau (SNT, seconde). Ce n’est pas le logiciel officiel.</p>' +
    '<h3>Conception</h3><ul><li>Choisissez un appareil dans la palette, puis cliquez dans la zone de travail.</li><li>Outil <b>Câble</b> : cliquez sur deux appareils pour les relier.</li><li>Cliquez sur un appareil pour régler son adresse IP, son masque, sa passerelle, son serveur DNS, ses logiciels.</li><li>Un routeur reçoit une interface par câble : donnez-lui une adresse dans chaque réseau.</li></ul>' +
    '<h3>Simulation</h3><ul><li>Cliquez sur un appareil pour ouvrir son poste : terminal, navigateur, serveurs, échanges de données.</li><li>Les paquets circulent sur les câbles : ARP, ICMP, DNS, DHCP, TCP, HTTP, chacun avec sa couleur. Réglez la vitesse ou mettez en pause.</li><li>L’onglet <b>Échanges</b> liste les trames reçues et envoyées. Cliquez sur une ligne pour voir les en-têtes des quatre couches.</li></ul>' +

});
