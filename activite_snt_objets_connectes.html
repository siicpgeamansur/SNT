COURSE.push({ id: 'embarque', t: 'L’informatique embarquée', h: `
<p>Un <b>système embarqué</b> est un petit système informatique intégré à un objet pour en commander le fonctionnement. Il est conçu pour une tâche précise, souvent avec peu de mémoire et peu d’énergie, et il ne se voit pas : on ne parle pas à un « ordinateur », on utilise un lave-linge, une voiture, une porte automatique.</p>
<table class="ctable"><thead><tr><th>Objet</th><th>Ce que fait le système embarqué</th></tr></thead><tbody>
<tr><td>Lave-linge</td><td>Mesure le niveau d’eau et la température, commande pompes, moteur et résistance.</td></tr>
<tr><td>Voiture</td><td>Des dizaines de calculateurs : freinage ABS, airbags, injection, aides à la conduite.</td></tr>
<tr><td>Carte bancaire</td><td>La puce exécute un programme de sécurité pour valider le paiement.</td></tr>
<tr><td>Porte automatique</td><td>Détecte une présence et commande le moteur.</td></tr>
<tr><td>Montre</td><td>Mesure le pouls, compte les pas, affiche l’heure et les notifications.</td></tr>
</tbody></table>
<div class="retain"><b>À retenir.</b> Un système embarqué est un ordinateur spécialisé, intégré à un objet, qui mesure, décide et agit sans intervention de l’utilisateur.</div>` });

COURSE.push({ id: 'composants', t: 'Capteurs, unité de traitement, actionneurs', h: `
<p>Tout système embarqué suit le même schéma :</p>
<ul>
<li>Les <b>capteurs</b> transforment une grandeur physique en signal électrique : température, lumière, mouvement, pression, son, position (GPS), humidité…</li>
<li>L’<b>unité de traitement</b> (microcontrôleur) lit les capteurs et exécute le programme.</li>
<li>Les <b>actionneurs</b> agissent sur le monde réel : moteur, relais, lampe, haut-parleur, vibreur, écran, électrovanne.</li>
</ul>
<table class="ctable"><thead><tr><th>Capteur</th><th>Mesure</th><th>Actionneur</th><th>Action</th></tr></thead><tbody>
<tr><td>Sonde de température</td><td>Chaleur</td><td>Relais de chaudière</td><td>Chauffer</td></tr>
<tr><td>Cellule photo-électrique</td><td>Lumière</td><td>Lampe</td><td>Éclairer</td></tr>
<tr><td>Radar de présence</td><td>Mouvement</td><td>Moteur de porte</td><td>Ouvrir</td></tr>
<tr><td>Accéléromètre</td><td>Accélération</td><td>Vibreur</td><td>Alerter</td></tr>
</tbody></table>
<div class="retain"><b>À retenir.</b> Entrée (capteurs) → traitement (microcontrôleur et programme) → sortie (actionneurs). Un microcontrôleur réunit sur une seule puce processeur, mémoire et entrées-sorties.</div>` });

COURSE.push({ id: 'programme', t: 'Le programme embarqué', h: `
<p>Le microcontrôleur exécute un programme qui <b>tourne en boucle</b> :</p>
<pre class="code">répéter indéfiniment :
  mesure = lire_capteur()
  si mesure &lt; seuil :
    actionner()
  sinon :
    arrêter()
  attendre(10 minutes)</pre>
<ul>
<li>Une <b>instruction conditionnelle</b> (« si… sinon… ») compare une mesure à un <b>seuil</b>.</li>
<li>Une <b>boucle</b> répète le cycle tant que le système est alimenté.</li>
<li>Des cartes comme Arduino, micro:bit ou Raspberry Pi Pico permettent de s’exercer avec Python, des blocs ou du C.</li>
<li>La contrainte d’énergie impose de mettre le microcontrôleur en <b>veille</b> entre deux mesures.</li>
</ul>
<div class="retain"><b>À retenir.</b> Le comportement d’un objet dépend de son programme : changer un seuil, un délai ou une règle change l’objet. Un réglage est un compromis (économie d’énergie / confort / sécurité).</div>` });

COURSE.push({ id: 'regulation', t: 'Régulation et rétroaction', h: `
<p>Un thermostat est un exemple de <b>boucle de rétroaction</b> (ou de régulation) :</p>
<ol>
<li>Le capteur <b>mesure</b> la température.</li>
<li>Le programme la <b>compare à la consigne</b> (la valeur souhaitée).</li>
<li>Il <b>commande</b> l’actionneur (chauffage allumé ou éteint).</li>
<li>L’actionneur modifie la température, que le capteur mesure à nouveau.</li>
</ol>
<ul>
<li>L’<b>hystérésis</b> est la zone autour de la consigne où l’on ne change pas d’état. Sans elle, le chauffage oscillerait sans cesse (usure, bruit). Avec une trop grande, la température varie davantage.</li>
<li>Une meilleure <b>isolation</b> réduit les pertes : le chauffage reste moins longtemps allumé.</li>
<li>Programmer l’abaissement de la consigne la nuit ou en cas d’absence économise de l’énergie.</li>
</ul>
<div class="retain"><b>À retenir.</b> Régulation = mesurer, comparer à la consigne, agir, recommencer. L’hystérésis évite que l’actionneur change d’état trop souvent.</div>` });

COURSE.push({ id: 'iot', t: 'Les objets connectés', h: `
<p>Un <b>objet connecté</b> est un système embarqué relié à un réseau (souvent Internet) pour échanger des données ou recevoir des ordres. On parle d’<b>Internet des objets</b> (IoT, <i>Internet of Things</i>).</p>
<h3>Exemples</h3>
<ul>
<li>Maison : thermostat, ampoules, volets, serrure, caméra, enceinte, compteur Linky.</li>
<li>Santé et sport : montre, bracelet, balance connectée, glucomètre.</li>
<li>Ville : parkings, poubelles, éclairage public, capteurs de qualité de l’air.</li>
<li>Agriculture : capteurs d’humidité, colliers pour animaux, irrigation.</li>
<li>Industrie et transport : suivi de colis, maintenance prédictive, voitures connectées.</li>
</ul>
<h3>Le trajet d’une donnée</h3>
<p>Objet → box ou passerelle → Internet → serveur du fabricant (le <b>cloud</b>) → application du smartphone. Les ordres font le chemin inverse.</p>
<div class="retain"><b>À retenir.</b> Un objet connecté ajoute à un système embarqué la communication, le stockage et le traitement à distance. Il dépend du réseau, du serveur et de l’application du fabricant.</div>` });

COURSE.push({ id: 'reseaux', t: 'Réseaux sans fil et énergie', h: `
<p>Chaque protocole est un compromis entre <b>portée</b>, <b>débit</b> et <b>consommation</b>.</p>
<table class="ctable"><thead><tr><th>Protocole</th><th>Portée</th><th>Débit</th><th>Consommation</th></tr></thead><tbody>
<tr><td>Bluetooth LE</td><td>10 à 50 m</td><td>≈ 1 Mbit/s</td><td>Faible</td></tr>
<tr><td>Wi-Fi</td><td>20 à 50 m</td><td>10 à 1 000 Mbit/s</td><td>Élevée</td></tr>
<tr><td>Zigbee</td><td>10 à 100 m</td><td>≈ 0,25 Mbit/s</td><td>Très faible</td></tr>
<tr><td>LoRa</td><td>2 à 15 km</td><td>0,3 à 50 kbit/s</td><td>Très faible</td></tr>
<tr><td>4G / 5G</td><td>Antennes mobiles</td><td>Élevé</td><td>Élevée</td></tr>
<tr><td>NFC</td><td>≈ 4 cm</td><td>≈ 0,4 Mbit/s</td><td>Sans pile côté carte</td></tr>
</tbody></table>
<h3>Autonomie</h3>
<p>Une pile contient une quantité d’énergie, la <b>capacité</b> (en mAh). L’autonomie est la capacité divisée par le courant moyen absorbé. Un objet passe presque tout son temps en veille et se réveille pour mesurer et émettre : émettre moins souvent allonge fortement l’autonomie.</p>
<div class="retain"><b>À retenir.</b> Pas de protocole idéal : le bon choix dépend de la distance, du volume de données et de la source d’énergie. Débit élevé = énergie élevée.</div>` });

COURSE.push({ id: 'donnees', t: 'Données et vie privée', h: `
<p>Les objets connectés collectent beaucoup de données, souvent sans que l’on y pense : habitudes de consommation, horaires de présence, déplacements, pouls, sons, images.</p>
<ul>
<li>Des données sans lien apparent permettent de <b>déduire</b> des informations privées (heure du lever, absence du logement, état de santé).</li>
<li>Les données sont stockées sur des serveurs, parfois à l’étranger, et peuvent être revendues ou analysées pour de la publicité.</li>
<li>Un micro ou une caméra connectée peuvent enregistrer des conversations ou des images.</li>
</ul>
<h3>Le RGPD</h3>
<p>Le Règlement général sur la protection des données (Europe, 2018) impose le <b>consentement</b>, la finalité claire, la minimisation des données, et donne le droit d’accès, de rectification et de suppression. La CNIL veille à son application en France.</p>
<div class="retain"><b>À retenir.</b> Les données d’un objet connecté sont des données personnelles : on peut en limiter la collecte (paramètres, désactivation du micro ou du cloud) et exercer ses droits.</div>` });

COURSE.push({ id: 'securite', t: 'Sécurité des objets connectés', h: `
<p>Un objet connecté est un ordinateur relié à Internet : il peut être attaqué.</p>
<h3>Risques</h3>
<ul>
<li>Prise de contrôle d’une caméra, d’une serrure, d’un jouet.</li>
<li>Objets piratés regroupés en réseau (<i>botnet</i>) pour attaquer des sites.</li>
<li>Vol de données personnelles.</li>
</ul>
<h3>Bonnes pratiques</h3>
<ul>
<li>Changer le mot de passe d’usine, utiliser un mot de passe long et unique (une phrase de passe).</li>
<li>Installer les mises à jour, choisir un fabricant qui en fournit.</li>
<li>Mettre les objets sur un réseau Wi-Fi séparé (réseau invité).</li>
<li>Désactiver les fonctions inutiles (micro, caméra, accès distant).</li>
</ul>
<p>Pour un mot de passe de L caractères tirés parmi N possibles, il y a N<sup>L</sup> combinaisons : chaque caractère ajouté multiplie le travail de l’attaquant par N.</p>
<div class="retain"><b>À retenir.</b> Sécurité = mot de passe fort et unique + mises à jour + réseau séparé + fonctions inutiles désactivées.</div>` });

COURSE.push({ id: 'impact', t: 'Impact environnemental', h: `
<ul>
<li><b>Fabrication</b> : métaux, terres rares, eau, énergie. Elle pèse souvent plus que l’usage.</li>
<li><b>Usage</b> : veille permanente, box, serveurs et réseaux qui hébergent les données.</li>
<li><b>Fin de vie</b> : déchets électroniques (DEEE), difficiles à recycler ; les piles contiennent des métaux.</li>
</ul>
<p>Exemple : un objet de 3 W en veille permanente consomme environ 26 kWh par an.</p>
<h3>Pistes pour réduire l’impact</h3>
<ul>
<li>Acheter moins, garder plus longtemps, réparer (indice de réparabilité).</li>
<li>Choisir des objets qui restent utilisables hors ligne et qui reçoivent des mises à jour longtemps.</li>
<li>Débrancher ou programmer l’arrêt des appareils inutilisés.</li>
<li>Se demander si la connexion est vraiment utile.</li>
</ul>
<div class="retain"><b>À retenir.</b> Un objet connecté peut économiser de l’énergie (chauffage, éclairage) mais sa fabrication et sa veille ont un coût. Le bilan dépend de l’usage réel et de la durée de vie.</div>` });

COURSE.push({ id: 'limites', t: 'Ce que la page simplifie', h: `
<ul>
<li>Le lampadaire, la journée de 24 h et les passants sont une <b>simulation fictive</b> : la luminosité suit une courbe théorique et le lampadaire fait 100 W.</li>
<li>Le modèle de chauffage est très simple : une seule pièce, une perte de chaleur proportionnelle à l’écart avec l’extérieur, un radiateur de 1,5 kW. Il n’y a ni inertie des murs, ni ensoleillement.</li>
<li>Les consommations et débits des réseaux sont des ordres de grandeur arrondis ; ils varient selon les modèles.</li>
<li>Le calcul d’autonomie ignore l’autodécharge, la température et la baisse de tension des piles.</li>
<li>Le calcul du temps de recherche d’un mot de passe suppose une attaque par force brute à 10 milliards d’essais par seconde ; en réalité, les attaquants utilisent des dictionnaires, et les services limitent les essais.</li>
<li>Les valeurs de CO₂ et de prix de l’électricité sont des moyennes approximatives.</li>
<li>Les microcontrôleurs réels exécutent des programmes beaucoup plus complexes (interruptions, mémoire, protocoles).</li>
</ul>` });

COURSE.push({ id: 'glossaire', t: 'Glossaire', h: `
<dl class="gloss">
<dt>Actionneur</dt><dd>Composant qui agit sur l’environnement (moteur, relais, lampe, haut-parleur).</dd>
<dt>Autonomie</dt><dd>Durée de fonctionnement d’un objet sur une batterie ou une pile.</dd>
<dt>Capacité (mAh)</dt><dd>Quantité de charge qu’une pile peut fournir.</dd>
<dt>Capteur</dt><dd>Composant qui mesure une grandeur physique.</dd>
<dt>Cloud</dt><dd>Serveurs distants qui stockent des données et exécutent des services.</dd>
<dt>Consigne</dt><dd>Valeur que le système cherche à atteindre.</dd>
<dt>Hystérésis</dt><dd>Écart toléré autour de la consigne avant de changer d’état.</dd>
<dt>IoT (Internet des objets)</dt><dd>Ensemble des objets reliés à Internet.</dd>
<dt>LoRa</dt><dd>Protocole sans fil à longue portée et très faible consommation.</dd>
<dt>Microcontrôleur</dt><dd>Puce qui réunit processeur, mémoire et entrées-sorties.</dd>
<dt>Protocole</dt><dd>Ensemble de règles pour échanger des données.</dd>
<dt>Rétroaction</dt><dd>Mesure du résultat d’une action pour ajuster la commande suivante.</dd>
<dt>RGPD</dt><dd>Règlement européen sur la protection des données personnelles.</dd>
<dt>Seuil</dt><dd>Valeur de comparaison qui déclenche une action.</dd>
<dt>Système embarqué</dt><dd>Système informatique intégré à un objet pour en commander le fonctionnement.</dd>
<dt>Veille</dt><dd>Mode à très faible consommation entre deux actions.</dd>
</dl>` });
/*COURSE-END*/

/* ---------- interface ---------- */
const UI = { cur: 'e1' };
const AS = { key: 'e1', tab: 'steps', open: false, st: lsGet(KEYS.act, {}), arm: null };
const CS = { open: false, id: 'web' };
function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }

function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': w.id === UI.cur ? 'true' : 'false', 'aria-selected': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id) }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');
  $('#hint').textContent = w.hint; root.innerHTML = '';
  w.mount(root);
  const sc = $('#scroller'); if (sc) sc.scrollTop = 0;
}
function gotoWs(id) {
  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}

function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open; box.classList.toggle('sheet', AS.open && isSmall());
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
box.dataset.k = tag;
  box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', null, (i + 1) + '. ' + q.q));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', null, o + (good ? '  ✓' : '') + (bad ? '  ✗' : ''))));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why' }, (miss ? 'Sans réponse. ' : '') + q.w)); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
box.append(body); body.scrollTop = keep;
}
function actToggle() {
  if (CS.open) { CS.open = false; renderCourse(); }
  AS.open = !AS.open; renderAct();
}
$('#bAct').addEventListener('click', actToggle);

/* ---------- cours ---------- */
function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }
function renderCourse() {
  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false'); btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;
  if (!CS.open) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);
  const go = id => { CS.id = id; renderCourse(); };
  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', { type: 'button', class: s.id === cur.id ? 'on' : '', 'aria-current': s.id === cur.id ? 'true' : 'false', onclick: () => go(s.id) }, (i + 1) + '. ' + s.t)));
  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: cur.h }));
    art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : informatique embarquée et objets connectés'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

/* ---------- aide ---------- */
function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Cinq ateliers pour comprendre l’informatique embarquée et les objets connectés (SNT, seconde) : capteurs et actionneurs, programme, régulation, réseaux, données et sécurité. Les simulations sont simplifiées.</p>' +
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut.</li><li>Le bouton <b>Activité</b> affiche les consignes, un défi et un QCM avec correction.</li><li>Le bouton <b>Cours</b> détaille toutes les notions.</li></ul>' +
    '<h3>Vos données</h3><p>Les réponses au QCM sont mémorisées dans ce navigateur uniquement.</p>' }));
});

/* ---------- démarrage ---------- */
(function init() {
    AS.open = !isSmall();
  renderSeg(); mountWs(); renderAct(); renderCourse();
})();

</script>
