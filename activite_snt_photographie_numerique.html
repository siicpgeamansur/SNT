const COURSE = [];
COURSE.push({ id: 'photo', t: 'De l’argentique au numérique', h: `
<p>Une photographie fixe la lumière d’une scène. Pendant longtemps, la lumière imprimait un support chimique ; aujourd’hui, elle est transformée en nombres.</p>
<table class="ctable"><thead><tr><th>Date</th><th>Événement</th></tr></thead><tbody>
<tr><td>1826</td><td>Nicéphore Niépce réalise la plus ancienne photographie conservée.</td></tr>
<tr><td>1839</td><td>Le daguerréotype est présenté au public.</td></tr>
<tr><td>1888</td><td>Kodak met la photographie à la portée du grand public.</td></tr>
<tr><td>1975</td><td>Steven Sasson (Kodak) construit le premier appareil photo numérique.</td></tr>
<tr><td>1992</td><td>Le format JPEG est normalisé.</td></tr>
<tr><td>Années 2000</td><td>Les téléphones intègrent un appareil photo ; les photos sont partagées en ligne.</td></tr>
</tbody></table>
<div class="retain"><b>À retenir.</b> Une photo numérique est un fichier de nombres : on peut la copier sans perte, la traiter par calcul, la compresser et l’envoyer sur Internet.</div>` });

COURSE.push({ id: 'capteur', t: 'Du capteur au fichier', h: `
<p>La lumière traverse l’objectif et tombe sur un <b>capteur</b> (CCD ou CMOS) formé de millions de cellules sensibles à la lumière. Chaque cellule mesure une quantité de lumière et la convertit en tension, puis en nombre.</p>
<ul>
<li>Chaque cellule ne « voit » qu’une couleur grâce à un filtre rouge, vert ou bleu (<b>filtre de Bayer</b>, avec deux fois plus de vert).</li>
<li>Le processeur de l’appareil reconstitue la couleur complète de chaque pixel à partir des voisins (<i>dématriçage</i>).</li>
<li>L’image est ensuite traitée (balance des blancs, netteté), compressée, puis enregistrée avec ses métadonnées.</li>
</ul>
<div class="retain"><b>À retenir.</b> Capteur → conversion en nombres → traitement → compression → fichier.</div>` });

COURSE.push({ id: 'pixels', t: 'Pixels, définition, résolution', h: `
<p>Une image numérique est une grille de <b>pixels</b>. Sa <b>définition</b> est le nombre de pixels : largeur × hauteur.</p>
<ul>
<li>1 mégapixel = 1 million de pixels. 4 000 × 3 000 = 12 Mpx.</li>
<li>Taille brute = nombre de pixels × octets par pixel (3 octets en 24 bits). 12 Mpx × 3 = 36 Mo.</li>
<li>La <b>résolution d’impression</b> se mesure en pixels par pouce (ppp ou dpi). 1 pouce = 2,54 cm. Pour un tirage de qualité, on vise environ 300 ppp.</li>
<li>Pixels nécessaires = (cm ÷ 2,54) × ppp. Pour 10 cm à 300 ppp : 1 181 pixels.</li>
</ul>
<div class="retain"><b>À retenir.</b> Plus il y a de pixels, plus l’image est détaillée et plus le fichier est lourd. Un écran n’a pas besoin de beaucoup de pixels ; une grande impression en demande davantage.</div>
<p><b>Attention :</b> « mégapixels » mesure la définition, pas la qualité. La qualité dépend aussi de l’objectif, de la taille du capteur et de l’éclairage.</p>` });

COURSE.push({ id: 'couleurs', t: 'Coder les couleurs', h: `
<p>Un écran fabrique les couleurs en mélangeant de la lumière rouge, verte et bleue : c’est la <b>synthèse additive</b>.</p>
<table class="ctable"><thead><tr><th>Couleur</th><th>(R, V, B)</th><th>Hexadécimal</th></tr></thead><tbody>
<tr><td>Rouge</td><td>(255, 0, 0)</td><td>#FF0000</td></tr>
<tr><td>Jaune</td><td>(255, 255, 0)</td><td>#FFFF00</td></tr>
<tr><td>Blanc</td><td>(255, 255, 255)</td><td>#FFFFFF</td></tr>
<tr><td>Noir</td><td>(0, 0, 0)</td><td>#000000</td></tr>
<tr><td>Orange</td><td>(255, 128, 0)</td><td>#FF8000</td></tr>
</tbody></table>
<ul>
<li>Chaque composante est codée sur 8 bits : 256 valeurs, de 0 à 255. L’hexadécimal l’écrit avec 2 chiffres (0 à 9 puis A à F).</li>
<li>Avec 3 × 8 = 24 bits, on obtient 256³ = 16 777 216 couleurs.</li>
<li>Avec b bits par composante, on a 2^(3b) couleurs.</li>
<li>Un gris a ses trois composantes égales.</li>
</ul>
<div class="retain"><b>À retenir.</b> Pixel = triplet (R, V, B). Moins de bits par composante = moins de couleurs, des bandes dans les dégradés, mais un fichier plus léger.</div>` });

COURSE.push({ id: 'traitement', t: 'Traiter une image', h: `
<p>Retoucher une image, c’est calculer de nouvelles valeurs de pixels.</p>
<h3>Traitements pixel par pixel</h3>
<ul>
<li><b>Niveaux de gris</b> : 0,299 R + 0,587 V + 0,114 B (l’œil est plus sensible au vert).</li>
<li><b>Négatif</b> : 255 − valeur.</li>
<li><b>Luminosité, contraste</b> : on ajoute une valeur ou on multiplie autour du gris moyen.</li>
<li><b>Seuillage</b> : noir si la valeur est sous le seuil, blanc sinon.</li>
</ul>
<h3>L’histogramme</h3>
<p>Il compte combien de pixels ont chaque niveau de gris. Tassé à gauche : image sombre. À droite : image claire. Étroit : image peu contrastée.</p>
<h3>La convolution</h3>
<p>Pour chaque pixel, on multiplie lui et ses 8 voisins par les coefficients d’une matrice 3 × 3, on additionne, puis on divise (souvent par la somme des coefficients).</p>
<ul>
<li><b>Flou</b> : neuf coefficients 1, divisés par 9 (moyenne).</li>
<li><b>Contours</b> : les zones uniformes donnent 0, les changements brusques ressortent.</li>
<li><b>Netteté</b> : renforce le pixel central par rapport à ses voisins.</li>
</ul>
<div class="retain"><b>À retenir.</b> Un filtre est un calcul sur les nombres de l’image. L’histogramme résume la répartition des luminosités.</div>` });

COURSE.push({ id: 'compression', t: 'Compresser une image', h: `
<p>Une photo brute de 12 Mpx pèse 36 Mo : on la compresse pour la stocker et l’envoyer.</p>
<h3>Sans perte</h3>
<p>On peut retrouver exactement l’image d’origine. Exemple : le <b>codage par plages</b> (RLE), qui note « 12 pixels blancs, 3 noirs… » au lieu de chaque pixel. Efficace sur les aplats, inefficace sur le bruit. Formats : PNG, GIF.</p>
<h3>Avec perte</h3>
<p>On supprime des détails peu visibles. Le <b>JPEG</b> découpe l’image en blocs de 8 × 8, convertit chaque bloc en fréquences (transformée en cosinus discrète), arrondit les fréquences fines (quantification) puis code le résultat. Plus la qualité est basse, plus on arrondit : fichier petit, mais blocs visibles et contours dégradés.</p>
<table class="ctable"><thead><tr><th>Format</th><th>Compression</th><th>Usage</th></tr></thead><tbody>
<tr><td>JPEG</td><td>avec perte</td><td>Photos</td></tr>
<tr><td>PNG</td><td>sans perte</td><td>Schémas, logos, captures</td></tr>
<tr><td>RAW</td><td>aucune ou peu</td><td>Données du capteur pour retouche</td></tr>
</tbody></table>
<div class="retain"><b>À retenir.</b> Sans perte : on retrouve l’original. Avec perte : fichier plus petit mais détails définitivement perdus. Il faut choisir un compromis taille / qualité.</div>` });

COURSE.push({ id: 'metadonnees', t: 'Les métadonnées', h: `
<p>Un fichier photo contient aussi des <b>métadonnées</b> (EXIF) : des informations sur l’image.</p>
<ul>
<li>Modèle d’appareil ou de téléphone.</li>
<li>Date et heure de la prise de vue.</li>
<li><b>Position GPS</b> si la localisation est activée.</li>
<li>Réglages (ouverture, temps de pose, sensibilité).</li>
<li>Logiciel de retouche, auteur.</li>
</ul>
<p>Ces informations sont utiles pour classer ses photos, mais elles peuvent révéler un domicile, un lieu d’études ou des habitudes. Beaucoup de réseaux sociaux les retirent à la publication, mais pas tous, ni les envois directs.</p>
<div class="retain"><b>À retenir.</b> Avant de partager une photo, on peut désactiver la localisation de l’appareil photo ou supprimer les métadonnées.</div>` });

COURSE.push({ id: 'retouche', t: 'Retouche, IA et fiabilité', h: `
<p>Retoucher une photo est ancien et souvent légitime (luminosité, recadrage). Le problème commence quand l’image trompe.</p>
<ul>
<li><b>Photo retouchée ou montée</b> : éléments ajoutés, retirés ou déplacés.</li>
<li><b>Image hors contexte</b> : une vraie photo présentée avec une fausse date ou un faux lieu.</li>
<li><b>Image générée par IA</b> : créée sans appareil photo ; hameçonnage de ressemblance : l’<i>hypertrucage</i> (<i>deepfake</i>) imite un visage ou une voix.</li>
</ul>
<h3>Vérifier</h3>
<ul>
<li>Qui publie ? La source est-elle identifiable et fiable ?</li>
<li>Date, lieu, contexte : cohérents ?</li>
<li>Recherche d’image inversée pour retrouver l’origine.</li>
<li>Détails étranges : mains, texte, reflets, ombres.</li>
<li>Comparer avec d’autres sources.</li>
</ul>
<div class="retain"><b>À retenir.</b> Une image n’est pas une preuve. On vérifie la source et le contexte avant de croire ou de partager.</div>` });

COURSE.push({ id: 'droit', t: 'Droit à l’image et droit d’auteur', h: `
<h3>Droit à l’image</h3>
<p>Toute personne a un droit sur son image. Publier une photo où elle est reconnaissable nécessite en principe son <b>accord</b> ; pour un mineur, celui de ses représentants légaux. Il existe des exceptions (foule, lieu public sans personne mise en avant, actualité), mais elles sont limitées.</p>
<h3>Droit d’auteur</h3>
<p>Une photo originale est protégée dès sa création : son auteur décide de sa reproduction et de sa diffusion. Trouver une image sur Internet ne la rend pas libre.</p>
<h3>Licences libres</h3>
<p>Les licences <b>Creative Commons</b> autorisent certains usages sous conditions : citer l’auteur (BY), pas d’usage commercial (NC), pas de modification (ND), partage à l’identique (SA).</p>
<h3>Données personnelles</h3>
<p>Un visage est une donnée personnelle. Le RGPD protège aussi les personnes face aux traitements automatisés (reconnaissance faciale).</p>
<div class="retain"><b>À retenir.</b> Pour publier une image : accord des personnes reconnaissables, respect de l’auteur et de la licence. En cas de doute, on demande.</div>` });

COURSE.push({ id: 'limites', t: 'Ce que la page simplifie', h: `
<ul>
<li>La scène de l’atelier est un <b>dessin généré par programme</b>, pas une vraie photo.</li>
<li>Les images sont petites (256 × 256 au maximum) pour que les calculs soient instantanés.</li>
<li>La taille JPEG est <b>estimée</b> par un calcul d’entropie ; un vrai encodeur JPEG fait mieux (codage de Huffman, sous-échantillonnage des couleurs).</li>
<li>La compression JPEG simulée travaille sur la luminosité d’une image de 64 × 64 pixels.</li>
<li>Le codage par plages est un exemple pédagogique ; PNG utilise d’autres méthodes (filtres, DEFLATE).</li>
<li>Les cas « vraie ou truquée » et « droits » sont des cas types ; la réalité juridique dépend de chaque situation.</li>
<li>Les métadonnées sont fictives.</li>
</ul>` });

function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }

function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': w.id === UI.cur ? 'true' : 'false', 'aria-selected': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id) }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');
  $('#hint').textContent = w.hint; root.innerHTML = '';
  w.mount(root);
  const sc = $('#scroller'); if (sc) sc.scrollTop = 0;
}
function gotoWs(id) {
  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}

function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open; box.classList.toggle('sheet', AS.open && isSmall());
  if (!AS.open) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', null, (i + 1) + '. ' + q.q));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', null, o + (good ? '  ✓' : '') + (bad ? '  ✗' : ''))));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why' }, (miss ? 'Sans réponse. ' : '') + q.w)); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body);
}
function actToggle() {
  if (CS.open) { CS.open = false; renderCourse(); }
  AS.open = !AS.open; renderAct();
}
$('#bAct').addEventListener('click', actToggle);

/* ---------- cours ---------- */
function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }
function renderCourse() {
  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false'); btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;
  if (!CS.open) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);
  const go = id => { CS.id = id; renderCourse(); };
  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', { type: 'button', class: s.id === cur.id ? 'on' : '', 'aria-current': s.id === cur.id ? 'true' : 'false', onclick: () => go(s.id) }, (i + 1) + '. ' + s.t)));
  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: cur.h }));
    art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : la photographie numérique'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

/* ---------- aide ---------- */
function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Cinq ateliers pour comprendre la photographie numérique (SNT, seconde) : pixels, couleurs, traitement, compression, métadonnées et droits. La scène des ateliers est un dessin généré par programme.</p>' +
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut.</li><li>Le bouton <b>Activité</b> affiche les consignes, un défi et un QCM avec correction.</li><li>Le bouton <b>Cours</b> détaille toutes les notions.</li></ul>' +
    '<h3>Vos données</h3><p>Les réponses au QCM sont mémorisées dans ce navigateur uniquement.</p>' }));
});

/* ---------- démarrage ---------- */
(function init() {
    AS.open = !isSmall();
  renderSeg(); mountWs(); renderAct(); renderCourse();
})();

</script>

</body></html>
