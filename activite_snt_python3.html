function decodeUtf8Base64(encoded) {
  const binary = atob(encoded);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}
const loaded = new Set();
function showPage(name) {
  for (const id of ["guided", "discovery"]) {
    document.getElementById(id).hidden = id !== name;
    document.querySelector('[data-page="' + id + '"]').setAttribute("aria-selected", String(id === name));
  }
  if (!loaded.has(name)) {
    document.getElementById(name).srcdoc = decodeUtf8Base64(SOURCES[name]);
    loaded.add(name);
  }
}
document.querySelectorAll("nav button").forEach(button => {
  button.addEventListener("click", () => showPage(button.dataset.page));
});
