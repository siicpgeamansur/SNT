<p>Nous comptons en <b>base 10</b> : dix chiffres, et chaque position vaut dix fois plus que la précédente. Cette écriture « positionnelle » se généralise à n'importe quelle base.</p>
<p>À l'intérieur d'un processeur, l'information est portée par des tensions électriques. Or un composant de base, le <b>transistor</b>, se comporte comme un interrupteur : soit il laisse passer le courant, soit il le bloque. Deux états stables — donc deux chiffres, 0 et 1. Le binaire n'est pas un choix de commodité : c'est la seule écriture directement réalisable en électronique, et deux états sont faciles à distinguer même quand le signal est bruité.</p>
<h3>La numération positionnelle en base 2</h3>
<p>Chaque position vaut une puissance de 2. Comme en base 10, on « dépile » chiffre par chiffre :</p>

<table class="ctable narrow"><thead><tr><th>2⁷</th><th>2⁶</th><th>2⁵</th><th>2⁴</th><th>2³</th><th>2²</th><th>2¹</th><th>2⁰</th></tr></thead><tbody>
<tr><td>128</td><td>64</td><td>32</td><td>16</td><td>8</td><td>4</td><td>2</td><td>1</td></tr>
<tr><td>1</td><td>1</td><td>0</td><td>0</td><td>1</td><td>1</td><td>0</td><td>1</td></tr></tbody></table>
<h3>Convertir : divisions successives</h3>
<p>Diviser par 2 donne comme reste le chiffre des unités en base 2 ; recommencer avec le quotient donne le chiffre suivant, et ainsi de suite. On lit les restes <b>de bas en haut</b>.</p>
<div class="retain"><b>À retenir.</b> Un <b>bit</b> = un chiffre binaire ; un <b>octet</b> = 8 bits = 256 valeurs (0 à 255). En base 2, chaque position vaut 2 fois la précédente.</div>` });

COURSE.push({ id: 'hex', t: 'L’hexadécimal', h: `
<p>L'hexadécimal compte en <b>base 16</b> : les chiffres 0 à 9 puis les lettres A (10), B (11), C (12), D (13), E (14), F (15). Le préfixe <code>0x</code> signale cette base.</p>
<h3>Pourquoi 16 ?</h3>
<p>16 = 2⁴ : un chiffre hexadécimal représente <b>exactement 4 bits</b>, et un octet (8 bits) se code avec <b>exactement 2 chiffres hexadécimaux</b>. L'écriture est donc 4 fois plus courte que le binaire, sans information perdue ni ambiguïté. C'est pourquoi la mémoire, les adresses réseau, les couleurs (#FF8000) et les codes d'erreur s'affichent en hexadécimal.</p>
<table class="ctable narrow"><thead><tr><th>Hex</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>A</td><td>B</td><td>C</td><td>D</td><td>E</td><td>F</td></tr></thead><tbody>
<tr><th>Binaire</th><td>0000</td><td>0001</td><td>0010</td><td>0011</td><td>0100</td><td>0101</td><td>0110</td><td>0111</td><td>1000</td><td>1001</td><td>1010</td><td>1011</td><td>1100</td><td>1101</td><td>1110</td><td>1111</td></tr></tbody></table>
<h3>Exemples</h3>
<ul><li>0xFF = 1111 1111₂ = 255 (un octet tout à 1).</li><li>0xA5 = 1010 0101₂ = 165.</li><li>0x10 = 16, 0x100 = 256 : les « ronds » hexadécimaux sont les puissances de 16.</li></ul>
<div class="retain"><b>À retenir.</b> 1 chiffre hexadécimal = 4 bits ; 1 octet = 2 chiffres hexadécimaux. On convertit un octet en lisant ses deux quartets indépendamment.</div>` });

COURSE.push({ id: 'addition', t: 'L’addition binaire et la retenue', h: `
<p>L'addition se pose colonne par colonne, de droite à gauche, comme en base 10 — avec des règles adaptées :</p>
<table class="ctable narrow"><tbody>
<tr><td>0 + 0</td><td>=</td><td>0</td></tr>
<tr><td>0 + 1 = 1 + 0</td><td>=</td><td>1</td></tr>
<tr><td>1 + 1</td><td>=</td><td>10₂ → on écrit 0, on retient 1</td></tr>
<tr><td>1 + 1 + 1 (retenue entrante)</td><td>=</td><td>11₂ → on écrit 1, on retient 1</td></tr></tbody></table>
<p>La <b>retenue sortante</b> d'une colonne devient la <b>retenue entrante</b> de la colonne suivante. Exemple : 1011 0011 + 0110 1010 = 1 0001 1101 (en 9 bits).</p>
<h3>Le dépassement (overflow)</h3>
<p>Sur un octet, seules 256 valeurs existent (0 à 255). Si la somme dépasse 255, la retenue finale est <b>perdue</b> : le résultat affiché est la somme <b>modulo 256</b>. Exemple : 200 + 100 = 300, affiché 44 car 300 − 256 = 44. Ce n'est pas une erreur du processeur : c'est une convention arithmétique, à connaître quand les résultats intermédiaires sont grands.</p>
<div class="retain"><b>À retenir.</b> 1 + 1 = 10₂ (écrire 0, retenir 1). Sur n bits, le calcul se fait modulo 2ⁿ : la retenue sortante est perdue.</div>` });

COURSE.push({ id: 'soustraction', t: 'La soustraction : complément à 2', h: `
<p>Poser une soustraction « à la main » demande des emprunts : en base 10 on emprunte 10, en binaire on emprunte <b>2</b> (0 − 1 : on emprunte, 2 − 1 = 1, et la colonne voisine diminue). Les processeurs font plus simple : ils <b>transforment la soustraction en addition</b>.</p>
<h3>L'astuce du modulo</h3>
<p>Sur un octet, ajouter 256 ne change pas le résultat (le calcul est fait modulo 256). Donc :</p>
<div class="formula">A − B = A + (256 − B)  et  256 − B = (255 − B) + 1 = NOT(B) + 1</div>
<p>Le nombre 256 − B s'appelle le <b>complément à 2</b> de B : on l'obtient en inversant chaque bit de B (NOT) puis en ajoutant 1. C'est l'écriture de −B sur un octet.</p>
<h3>Exemple : 50 − 80</h3>
<ul><li>NOT(80) = 175 ; 175 + 1 = 176 (écriture de −80).</li><li>50 + 176 = 226, sans retenue sortante → résultat <b>négatif</b> : 226 − 256 = <b>−30</b>.</li></ul>
<p>Si la retenue finale vaut 1, le résultat est positif (c'est la somme) ; s'il n'y a pas de retenue, il est négatif (somme − 256). Le signe « tombe » de la retenue, sans aucun bit de signe spécial.</p>
<div class="retain"><b>À retenir.</b> Soustraire = ajouter le complément à 2 : inverser les bits puis ajouter 1. Un seul circuit (l'additionneur) suffit, et le signe se lit sur la retenue finale.</div>` });

COURSE.push({ id: 'logique', t: 'Les opérations logiques', h: `
<p>AND (ET), OR (OU), XOR (OU exclusif) et NOT (NON) s'appliquent <b>bit par bit</b>. Pour chaque position, on applique la table de vérité :</p>
<table class="ctable narrow"><thead><tr><th>A</th><th>B</th><th>AND</th><th>OR</th><th>XOR</th></tr></thead><tbody>
<tr><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
<tr><td>0</td><td>1</td><td>0</td><td>1</td><td>1</td></tr>
<tr><td>1</td><td>0</td><td>0</td><td>1</td><td>1</td></tr>
<tr><td>1</td><td>1</td><td>1</td><td>1</td><td>0</td></tr></tbody></table>
<p>NOT n'a qu'une entrée : 0 devient 1 et 1 devient 0.</p>
<h3>À quoi ça sert ?</h3>
<ul><li><b>AND</b> = garder : x AND 1 = x, x AND 0 = 0 → extraire des champs de bits (masques, adresses réseau).</li>
<li><b>OR</b> = allumer : x OR 1 = 1 → mettre des options à 1 sans toucher aux autres.</li>
<li><b>XOR</b> = comparer : 1 signale une différence. Et (M XOR clé) XOR clé = M : il chiffre <i>et</i> déchiffre avec la même opération.</li>
<li><b>NOT</b> = inverser : première étape du complément à 2.</li></ul>
<div class="retain"><b>À retenir.</b> AND garde (avec 1) ou efface (avec 0), OR force à 1, XOR détecte les différences et est réversible, NOT inverse tout.</div>` });

COURSE.push({ id: 'masques', t: 'Les masques et les adresses IP', h: `
<p>Un <b>masque</b> est un nombre dont les bits à 1 délimitent la zone qu'on veut conserver. Combiné par AND, il filtre les bits : c'est l'outil qui permet de découper une adresse IPv4.</p>
<h3>Exemple : 192.168.10.25 /24</h3>
<p>Le « /24 » dit que les 24 premiers bits sont la <b>partie réseau</b>, les 8 derniers la <b>partie machine</b>. Le masque vaut donc 255.255.255.0 = 24 bits à 1 suivis de 8 bits à 0.</p>
<pre class="code">IP      11000000.10101000.00001010.00011001  (192.168.10.25)
Masque  11111111.11111111.11111111.00000000  (255.255.255.0)
        ------------------------ ---------
        partie réseau           partie machine
ET      11000000.10101000.00001010.00000000  → réseau : 192.168.10.0</pre>
<p>Le <b>broadcast</b> (message à toutes les machines du réseau) met tous les bits machine à 1 : IP OR (NOT masque) = 192.168.10.255. Le nombre de machines utilisables est 2^(bits machine) − 2 (on retire l'adresse réseau et le broadcast) : ici 2⁸ − 2 = 254.</p>
<h3>Pourquoi le ET ?</h3>
<p>Pour un bit x : x AND 1 = x (conservé) et x AND 0 = 0 (effacé). Les bits à 1 du masque laissent donc passer la partie réseau et annulent la partie machine : c'est exactement le découpage voulu.</p>
<div class="retain"><b>À retenir.</b> Masque : bits à 1 = réseau, bits à 0 = machines. Réseau = IP AND masque ; broadcast = IP OR (NOT masque) ; hôtes = 2^(bits machine) − 2.</div>` });

COURSE.push({ id: 'gray', t: 'Le code Gray', h: `
<p>En binaire pur, plusieurs bits peuvent changer d'un coup : 0111 → 1000 fait basculer <b>les 4 bits</b> (pire cas aux puissances de 2). Le <b>code Gray</b> est un autre codage où <b>un seul bit change entre deux codes consécutifs</b>.</p>
<table class="ctable narrow"><thead><tr><th>Nombre</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td></tr></thead><tbody>
<tr><th>Binaire</th><td>000</td><td>001</td><td>010</td><td>011</td><td>100</td><td>101</td><td>110</td><td>111</td></tr>
<tr><th>Gray</th><td>000</td><td>001</td><td>011</td><td>010</td><td>110</td><td>111</td><td>101</td><td>100</td></tr></tbody></table>
<h3>Pourquoi l'utilise-t-on ?</h3>
<p>Un capteur qui lit une position <b>pendant</b> qu'elle change peut voir un mélange d'anciens et de nouveaux bits. En binaire, 0111 → 1000 peut donner 0000 ou 1111 : une valeur très éloignée de la réalité. En Gray, une seule valeur parasite est possible, toujours <b>voisine</b> : l'erreur transitoire est bornée à un pas. D'où son usage dans les codeurs rotatifs (axes de machines, volants, capteurs de position).</p>
<h3>Les conversions</h3>
<ul><li><b>Binaire → Gray</b> : g = n XOR (n décalé d'un bit vers la droite), car le bit de rang i de g vaut b_i XOR b_{i+1}.</li><li><b>Gray → binaire</b> : le bit de poids fort est identique (b₇ = g₇), puis b_i = b_{i+1} XOR g_i, de gauche à droite.</li></ul>
<div class="retain"><b>À retenir.</b> Le code Gray change d'un seul bit à la fois : c'est un codage pensé pour les capteurs et la transmission fiable.</div>` });

COURSE.push({ id: 'limites', t: 'Ce que la page simplifie', h: `
<ul>
<li>Tous les calculs se font sur <b>un octet</b> (8 bits), alors que les processeurs manipulent des nombres de 32 ou 64 bits. Les principes (retenue, dépassement, complément à 2) sont identiques, avec 2ⁿ au lieu de 256.</li>
<li>Le <b>dépassement</b> existe vraiment, mais les langages et processeurs offrent des moyens de le détecter ; ici, la retenue est simplement perdue.</li>
<li>Seule l'<b>IPv4</b> est présentée ; l'IPv6 utilise 128 bits et une écriture hexadécimale.</li>
<li>Le « chiffrement » par XOR de l'atelier 3 est un <b>modèle pédagogique</b> (chiffre de Vernam simplifié à une clé d'un octet) : il ne doit jamais être utilisé pour protéger de vraies données.</li>
<li>Les codes Gray sont montrés sur 4 bits (compteur) et 8 bits (convertisseur) ; en pratique, les codeurs utilisent 10 à 20 bits.</li>
<li>Dans un octet signé (complément à 2), les valeurs vont de −128 à 127 ; cette page affiche plutôt le résultat « non signé » puis le déduit.</li>
</ul>` });

COURSE.push({ id: 'glossaire', t: 'Glossaire', h: `
<dl class="gloss">
<dt>Base (d'une numération)</dt><dd>Nombre de chiffres distincts (10 décimal, 2 binaire, 16 hexadécimal).</dd>
<dt>Bit</dt><dd>Chiffre binaire (0 ou 1), contraction de « binary digit ».</dd>
<dt>Octet</dt><dd>Groupe de 8 bits, 256 valeurs possibles (0 à 255).</dd>
<dt>Quartet</dt><dd>Groupe de 4 bits = un chiffre hexadécimal.</dd>
<dt>Hexadécimal</dt><dd>Base 16, chiffres 0-9 et A-F ; préfixe 0x.</dd>
<dt>Retenue (carry)</dt><dd>Bit rapporté à la colonne suivante quand la somme dépasse la base.</dd>
<dt>Dépassement (overflow)</dt><dd>Perte de la retenue finale sur un nombre de bits fixé : calcul modulo 2ⁿ.</dd>
<dt>Complément à 2</dt><dd>Écriture de −B : inverser les bits (NOT) puis ajouter 1.</dd>
<dt>AND / ET</dt><dd>Résultat 1 seulement si les deux bits valent 1 ; « garde » des bits.</dd>
<dt>OR / OU</dt><dd>Résultat 1 si au moins un bit vaut 1 ; « allume » des bits.</dd>
<dt>XOR / OU exclusif</dt><dd>Résultat 1 si les bits sont différents ; compare, chiffre (réversible).</dd>
<dt>NOT / NON</dt><dd>Inverse chaque bit.</dd>
<dt>Masque</dt><dd>Nombre qui filtre des bits par AND : 1 = à garder, 0 = à effacer.</dd>
<dt>Adresse réseau</dt><dd>Partie réseau d'une IP (bits machine à 0).</dd>
<dt>Broadcast</dt><dd>Adresse de diffusion à toutes les machines du réseau (bits machine à 1).</dd>
<dt>Code Gray</dt><dd>Codage où un seul bit change entre deux codes consécutifs.</dd>
<dt>Décalage (shift)</dt><dd>Déplacement des bits vers la gauche ou la droite (n &gt;&gt; 1).</dd>
</dl>` });
