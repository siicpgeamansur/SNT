const COURSE = [];
COURSE.push({ id: 'histoire', t: 'Qu’est-ce qu’un réseau social ?', h: `
<p>Un <b>réseau social</b> est un service en ligne qui permet à ses utilisateurs de créer un <b>profil</b>, de se <b>relier</b> à d’autres personnes et de <b>publier ou échanger</b> des contenus (textes, photos, vidéos, messages).</p>
<h3>Quelques types de réseaux</h3>
<ul>
<li><b>Réseaux d’amis et de famille</b>, centrés sur des relations existantes.</li>
<li><b>Réseaux de partage de contenus</b> (photos, vidéos courtes, musique) où l’on suit aussi des inconnus.</li>
<li><b>Réseaux professionnels</b>, pour la carrière et le recrutement.</li>
<li><b>Messageries</b> et forums, plus proches de conversations privées ou de groupes.</li>
</ul>
<h3>Repères historiques</h3>
<table class="ctable"><thead><tr><th>Date</th><th>Événement</th></tr></thead><tbody>
<tr><td>1929, 1967</td><td>L’idée des « chaînes de connaissances » est proposée par Frigyes Karinthy, puis testée par Stanley Milgram : en moyenne, quelques intermédiaires séparent deux personnes.</td></tr>
<tr><td>1997</td><td>SixDegrees.com, l’un des premiers sites où l’on déclare ses relations.</td></tr>
<tr><td>2003 à 2006</td><td>MySpace, LinkedIn, Facebook (2004), YouTube (2005), Twitter (2006).</td></tr>
<tr><td>2010 à 2011</td><td>Instagram et Snapchat : la photo et le smartphone deviennent centraux.</td></tr>
<tr><td>Depuis 2016</td><td>Les vidéos courtes recommandées par algorithme prennent une place majeure.</td></tr>
</tbody></table>
<div class="retain"><b>À retenir.</b> Un réseau social = des profils, des relations, des contenus. Le Web et les smartphones ont permis son développement massif depuis les années 2000.</div>` });

COURSE.push({ id: 'graphe', t: 'Réseau social et graphe', h: `
<p>Les mathématiciens modélisent un réseau social par un <b>graphe</b>.</p>
<ul>
<li>Un <b>sommet</b> représente une personne (un compte).</li>
<li>Une <b>arête</b> représente une relation entre deux personnes (amitié, abonnement réciproque).</li>
<li>Le <b>degré</b> d’un sommet est son nombre d’arêtes, c’est-à-dire son nombre d’amis.</li>
<li>Un <b>chemin</b> est une suite d’arêtes qui relie deux sommets. Sa <b>longueur</b> est son nombre d’arêtes.</li>
<li>La <b>distance</b> entre deux sommets est la longueur du plus court chemin.</li>
<li>Un graphe est <b>connexe</b> si l’on peut aller de n’importe quel sommet à n’importe quel autre.</li>
</ul>
<p>Dans un réseau où les amitiés sont réciproques, le graphe est <b>non orienté</b>. Quand on peut suivre quelqu’un sans être suivi en retour (abonnements), il est <b>orienté</b> : les arêtes sont des flèches.</p>
<h3>La somme des degrés</h3>
<p>Chaque arête relie deux sommets, donc elle compte pour 2 dans la somme des degrés :</p>
<div class="formula">somme des degrés = 2 × nombre d’arêtes</div>
<p>C’est le lemme des poignées de mains. Il impose que la somme des degrés soit toujours un nombre pair. Dans un graphe complet de <i>n</i> personnes, le nombre de relations est <i>n</i>(<i>n</i> − 1)/2 (voir la page sur Internet, avec les câbles).</p>
<h3>Le petit monde</h3>
<p>Dans la plupart des réseaux sociaux, deux personnes quelconques sont séparées par un <b>petit nombre d’intermédiaires</b>. C’est le phénomène du <b>petit monde</b> (« six degrés de séparation »). Il vient de quelques personnes très connectées (les <b>hubs</b>), qui servent de raccourcis. Essayez :</p>
<div class="widget" data-w="hand"></div>
<p>Ce calcul est un maximum : en réalité, beaucoup d’amis sont communs, donc moins de personnes sont atteintes, mais la croissance reste très rapide.</p>
<h3>Conséquences</h3>
<ul>
<li>Une information (ou une rumeur) se propage <b>très vite</b> : en quelques étapes elle atteint presque tout le réseau.</li>
<li>Les personnes très connectées ont un <b>poids énorme</b> : les supprimer ou les convaincre change beaucoup de choses.</li>
<li>Les réseaux utilisent le graphe pour <b>suggérer des amis</b> : les amis d’amis sont des candidats naturels.</li>
</ul>
<div class="retain"><b>À retenir.</b> Réseau social = graphe (sommets = personnes, arêtes = relations). Somme des degrés = 2 × arêtes. Petit monde : peu d’intermédiaires entre deux personnes, grâce aux hubs.</div>` });

COURSE.push({ id: 'algo', t: 'Algorithmes de recommandation', h: `
<p>Un réseau social possède bien plus de contenus à montrer que ce qu’un utilisateur peut lire. Un <b>algorithme de recommandation</b> trie les contenus et choisit ceux qui apparaissent dans votre fil.</p>
<h3>Comment ça marche, en gros ?</h3>
<ol>
<li>La plateforme <b>collecte</b> des signaux : ce que vous aimez, regardez jusqu’au bout, commentez, partagez, les comptes que vous suivez, la durée passée sur chaque contenu.</li>
<li>Elle <b>calcule un score</b> pour chaque contenu possible : la probabilité que vous réagissiez.</li>
<li>Elle <b>affiche d’abord</b> les contenus aux meilleurs scores.</li>
<li>Elle <b>observe votre réaction</b> et ajuste son modèle : on parle d’une boucle de rétroaction.</li>
</ol>
<h3>Quel objectif ?</h3>
<p>L’objectif de la plateforme est souvent de maximiser l’<b>engagement</b> : le temps passé et les interactions. Plus on reste, plus on voit de publicités (voir la section sur le modèle économique).</p>
<h3>Effets possibles</h3>
<ul>
<li><b>Bulle de filtres</b> : le fil se rétrécit autour de ce qu’on aime déjà ; on voit moins de sujets et de points de vue différents.</li>
<li><b>Chambre d’écho</b> : on ne rencontre que des opinions semblables aux siennes, qui se renforcent.</li>
<li><b>Contenus extrêmes ou émotionnels</b> favorisés : ils déclenchent plus de réactions, donc plus d’engagement.</li>
<li><b>Viralité</b> : un contenu aimé et partagé est montré à encore plus de monde.</li>
</ul>
<h3>Que peut faire l’utilisateur ?</h3>
<ul>
<li>Choisir, quand c’est possible, un fil <b>chronologique</b> ou limiter la personnalisation.</li>
<li>Suivre des sources variées, et chercher volontairement d’autres points de vue.</li>
<li>Se rappeler que le fil est <b>un choix de la plateforme</b>, pas le reflet du monde.</li>
<li>Utiliser les réglages de temps d’écran et couper les notifications inutiles.</li>
</ul>
<p>En Europe, les très grandes plateformes doivent aussi expliquer leurs principaux critères de recommandation et proposer une option de fil non personnalisé (règlement sur les services numériques, DSA).</p>
<div class="retain"><b>À retenir.</b> Un algorithme de recommandation trie les contenus d’après vos actions passées pour maximiser l’engagement. Risques : bulle de filtres, chambre d’écho, contenus polarisants.</div>` });

COURSE.push({ id: 'economie', t: 'Le modèle économique', h: `
<p>Les grands réseaux sociaux sont gratuits pour l’utilisateur, mais coûtent très cher à faire fonctionner (serveurs, équipes, modération). Leur principale source de revenus est la <b>publicité</b>.</p>
<h3>Le principe</h3>
<ol>
<li>Les utilisateurs fournissent des <b>données</b> (âge, ville, goûts, temps passé, contacts) et passent du <b>temps</b> sur la plateforme.</li>
<li>La plateforme vend à des <b>annonceurs</b> des espaces publicitaires, qu’ils peuvent <b>cibler</b> selon ces données.</li>
<li>Plus la cible est précise, plus l’annonce est efficace, donc plus elle est chère.</li>
</ol>
<p>L’annonceur ne reçoit pas directement vos données : il choisit une cible, et la plateforme affiche la publicité aux personnes concernées. Mais pour la plateforme, vos données ont une grande valeur.</p>
<h3>Les ordres de grandeur</h3>
<p>Le prix d’une publicité se compte souvent pour 1 000 affichages (le CPM). Avec des millions d’utilisateurs qui voient chacun de nombreuses publicités par jour, les revenus se comptent en milliards (voir l’atelier 3).</p>
<h3>L’économie de l’attention</h3>
<p>Le temps d’attention est limité. Les plateformes rivalisent pour le capter : notifications, défilement sans fin, lecture automatique. L’expression « si c’est gratuit, c’est vous le produit » résume ce modèle : ce qui est vendu, c’est l’accès à votre attention.</p>
<h3>Autres revenus</h3>
<ul>
<li>Abonnements payants (sans publicité ou avec options).</li>
<li>Contenus sponsorisés et placements de produits par des influenceurs.</li>
<li>Vente de services aux entreprises (boutiques, outils d’analyse).</li>
</ul>
<div class="retain"><b>À retenir.</b> Gratuit pour l’utilisateur, financé par la publicité ciblée. Données personnelles et attention sont la matière première du modèle économique.</div>` });

COURSE.push({ id: 'donnees', t: 'Données personnelles et droit', h: `
<h3>Donnée personnelle</h3>
<p>Une <b>donnée personnelle</b> est toute information qui permet d’identifier une personne, directement (nom, photo) ou en recoupant plusieurs informations (âge, ville, établissement, centres d’intérêt).</p>
<h3>Le RGPD</h3>
<p>Le <b>Règlement général sur la protection des données</b> (RGPD) s’applique dans toute l’Union européenne depuis 2018. En France, la <b>CNIL</b> veille à son respect. Principes :</p>
<ul>
<li><b>Finalité</b> : on ne collecte des données que pour un but précis.</li>
<li><b>Minimisation</b> : seulement les données nécessaires.</li>
<li><b>Consentement</b> clair pour les usages non indispensables.</li>
<li><b>Droits de la personne</b> : être informée, accéder à ses données, les corriger, demander leur effacement, s’opposer à leur usage.</li>
</ul>
<p>En France, avant 15 ans, l’accord d’un parent est nécessaire pour que le réseau traite vos données personnelles. Beaucoup de plateformes fixent aussi dans leurs conditions d’utilisation un âge minimum, souvent 13 ans.</p>
<h3>Quelques règles de droit à connaître</h3>
<ul>
<li><b>Droit à l’image</b> : on ne publie pas la photo d’une personne sans son accord.</li>
<li><b>Injure, diffamation, menaces, harcèlement</b> : ces comportements sont punis par la loi, en ligne comme hors ligne.</li>
<li>Les contenus qui incitent à la haine ou à la violence sont interdits.</li>
</ul>
<div class="retain"><b>À retenir.</b> Le RGPD donne des droits sur ses données (accès, correction, effacement). La CNIL contrôle. Les propos en ligne sont soumis à la loi.</div>` });

COURSE.push({ id: 'identite', t: 'Identité numérique et traces', h: `
<h3>Identité numérique</h3>
<p>L’<b>identité numérique</b> est l’ensemble des informations qui concernent une personne sur Internet : son profil, ce qu’elle publie, ses commentaires, ses photos, et aussi ce que d’autres publient à son sujet.</p>
<h3>Trois types de traces</h3>
<ul>
<li><b>Traces volontaires</b> : ce que l’on publie soi-même.</li>
<li><b>Traces involontaires</b> : données collectées sans qu’on y pense (adresse IP, localisation, historique, cookies).</li>
<li><b>Traces laissées par les autres</b> : photos où l’on est identifié, commentaires, captures.</li>
</ul>
<h3>Le croisement d’informations</h3>
<p>Une information seule paraît souvent anodine. Mais en croisant plusieurs informations publiques, on peut en déduire beaucoup : où la personne étudie, où elle sera à telle heure, quand son domicile est vide, quel pourrait être son mot de passe. C’est ce que montre l’atelier 4.</p>
<h3>E-réputation</h3>
<p>L’<b>e-réputation</b> est l’image de soi qu’on donne sur Internet. Elle peut être regardée par des établissements, des employeurs, des inconnus. Ce qui est publié peut être <b>copié, capturé, archivé</b> : une publication supprimée n’a pas forcément disparu.</p>
<h3>Bonnes pratiques</h3>
<ul>
<li>Se demander : « Est-ce que je serais gêné que ma famille, mon futur employeur ou un inconnu voie cela ? »</li>
<li>Régler la <b>confidentialité</b> : compte privé, choix de qui voit les publications et les tags.</li>
<li>Désactiver la <b>localisation</b> des photos et des publications.</li>
<li>Ne pas publier les informations d’autres personnes sans leur accord.</li>
<li>Utiliser des mots de passe qui n’ont aucun lien avec des informations publiques, et la double authentification.</li>
<li>Rechercher son propre nom sur un moteur de recherche pour voir ce qui existe, et demander l’effacement de ce qui ne doit pas rester.</li>
</ul>
<div class="retain"><b>À retenir.</b> L’identité numérique est faite de traces volontaires, involontaires et laissées par les autres. Le croisement d’informations révèle beaucoup. Ce qui est publié peut rester.</div>` });

COURSE.push({ id: 'desinfo', t: 'Information et désinformation', h: `
<p>Les réseaux sociaux sont devenus une source d’information, mais n’importe qui peut y publier, sans vérification.</p>
<h3>Vocabulaire</h3>
<ul>
<li><b>Information fausse involontaire</b> : une erreur de bonne foi.</li>
<li><b>Intox / désinformation</b> : fausse information diffusée pour tromper ou nuire.</li>
<li><b>Rumeur</b> : information non vérifiée qui se transmet de personne en personne.</li>
<li><b>Canular (hoax)</b> : information inventée pour amuser ou tromper.</li>
<li><b>Contenu manipulé</b> : image ou vidéo retouchée, sortie de son contexte, ou générée par une intelligence artificielle.</li>
</ul>
<h3>Pourquoi ça se propage</h3>
<ul>
<li>Les contenus qui <b>choquent ou émeuvent</b> sont plus partagés.</li>
<li>L’algorithme les met en avant (voir la section sur les recommandations).</li>
<li>Le graphe est un petit monde : la rumeur atteint vite tout le monde.</li>
<li>On partage plus facilement ce qui <b>confirme</b> ce qu’on pense (biais de confirmation).</li>
</ul>
<h3>Réflexes de vérification</h3>
<ol>
<li><b>Qui</b> publie ? Source identifiée ou compte anonyme récent ?</li>
<li><b>Quand</b> ? La date est-elle récente, ou l’information est-elle ancienne ?</li>
<li><b>Comment</b> est-ce écrit ? Majuscules, urgence, « partagez avant suppression » : signaux d’alerte.</li>
<li><b>Où</b> est la source ? Y a-t-il un lien, un auteur, des chiffres précis ?</li>
<li><b>Ailleurs</b> : la même information existe-t-elle chez plusieurs sources indépendantes ?</li>
<li><b>Image</b> : la recherche d’image inversée donne-t-elle une autre origine ?</li>
</ol>
<p>En cas de doute : <b>ne pas partager</b>. Si le contenu est trompeur, le signaler au réseau.</p>
<h3>Hameçonnage</h3>
<p>Beaucoup de messages sur les réseaux sont des arnaques (faux concours, faux support) qui cherchent à voler un mot de passe. Un réseau ne demande jamais votre mot de passe sur un site extérieur (voir la page sur le Web).</p>
<div class="retain"><b>À retenir.</b> Avant de partager : qui, quand, où est la source, ailleurs, image. Un contenu qui pousse à partager vite est suspect. En cas de doute, on ne relaie pas.</div>` });

COURSE.push({ id: 'harcelement', t: 'Cyberharcèlement', h: `
<p>Le <b>cyberharcèlement</b> est un harcèlement qui passe par les outils numériques : messages d’insultes, moqueries publiques, photos humiliantes, faux profils, exclusion de groupes, rumeurs.</p>
<h3>Ce qui le rend particulier</h3>
<ul>
<li><b>Permanent</b> : il peut suivre la victime jusque chez elle, à toute heure.</li>
<li><b>Massif</b> : un contenu peut être vu par des centaines de personnes.</li>
<li><b>Durable</b> : une publication peut être copiée et revenir.</li>
<li>Les auteurs se sentent parfois <b>anonymes</b>, mais ils peuvent être identifiés.</li>
</ul>
<h3>Qui est responsable ?</h3>
<p>Les <b>auteurs</b>, mais aussi ceux qui <b>relaient</b>, commentent ou « likent » pour se moquer : sans eux, le harcèlement n’aurait pas cette ampleur. Le harcèlement est un délit puni par la loi, avec des peines pouvant aller jusqu’à plusieurs années de prison.</p>
<h3>Si vous êtes victime</h3>
<ol>
<li><b>Ne pas répondre</b> ni se venger.</li>
<li><b>Garder des preuves</b> : captures d’écran avec date et nom des comptes.</li>
<li><b>Bloquer</b> l’auteur et <b>signaler</b> les contenus au réseau.</li>
<li><b>En parler</b> à un adulte de confiance : parent, CPE, professeur, infirmière scolaire, chef d’établissement.</li>
<li><b>Appeler le 3018</b> : numéro national gratuit contre le harcèlement et les violences numériques, avec des professionnels à l’écoute.</li>
</ol>
<h3>Si vous êtes témoin</h3>
<ul>
<li>Ne pas relayer, ne pas liker, ne pas commenter.</li>
<li>Soutenir la victime en privé et lui conseiller d’en parler.</li>
<li>Signaler le contenu, et prévenir un adulte.</li>
</ul>
<p>Si vous vous sentez très mal ou en danger : le <b>3114</b> est le numéro national de prévention du suicide, gratuit, joignable 24 h/24. En cas de danger immédiat : le <b>112</b>.</p>
<div class="retain"><b>À retenir.</b> Cyberharcèlement : ne pas répondre, garder des preuves, bloquer et signaler, en parler à un adulte, appeler le 3018. Relayer, c’est participer.</div>` });

COURSE.push({ id: 'bienetre', t: 'Usages et bien-être', h: `
<p>Les réseaux sociaux ont de vrais avantages : garder le contact, s’informer, créer, s’engager. Ils peuvent aussi avoir des effets négatifs si l’on ne garde pas la maîtrise de son usage.</p>
<h3>Mécanismes qui retiennent l’attention</h3>
<ul>
<li>Le <b>défilement infini</b> (pas de « fin » naturelle).</li>
<li>Les <b>notifications</b>, qui rappellent à revenir.</li>
<li>Les <b>récompenses variables</b> : on ne sait jamais combien de « J’aime » on aura, ce qui donne envie de regarder.</li>
<li>La <b>comparaison sociale</b> : on compare sa vie aux vies mises en scène des autres.</li>
</ul>
<h3>Signes d’alerte</h3>
<ul>
<li>Difficulté à s’arrêter, ou à se concentrer sans consulter son téléphone.</li>
<li>Sommeil réduit à cause des écrans, fatigue.</li>
<li>Humeur qui dépend des « J’aime » ou des réactions.</li>
<li>Moins d’activités hors ligne qu’avant.</li>
</ul>
<h3>Reprendre la main</h3>
<ul>
<li>Fixer un <b>temps d’écran</b> et utiliser les outils de suivi du téléphone.</li>
<li>Couper les <b>notifications</b> non essentielles, et ne pas garder le téléphone dans la chambre la nuit.</li>
<li>Choisir ses abonnements, et désabonner ce qui met mal à l’aise.</li>
<li>Se rappeler que les images sont <b>sélectionnées et retouchées</b>.</li>
<li>Parler à un adulte ou un professionnel de santé si l’on se sent mal : le 3114 est joignable 24 h/24.</li>
</ul>
<div class="retain"><b>À retenir.</b> Les réseaux sont conçus pour retenir l’attention. Reprendre la main : limiter le temps, couper les notifications, choisir ce qu’on suit.</div>` });

COURSE.push({ id: 'limites', t: 'Ce que la page simplifie', h: `
<ul>
<li>Le réseau « LycéeGram », les personnes, les publications et les publicités sont <b>fictifs</b>. Aucune vraie plateforme n’est utilisée.</li>
<li>Le graphe n’a que 16 personnes et des amitiés réciproques. Les vrais réseaux ont des milliards de comptes et souvent des relations orientées.</li>
<li>L’algorithme du fil est un score très simple (« J’aime » + popularité + fraîcheur). Les vrais algorithmes combinent des milliers de signaux et changent en permanence.</li>
<li>La propagation de la rumeur est déterministe : à chaque étape, tous les amis sont informés. Dans la réalité, chacun partage ou non, avec une certaine probabilité.</li>
<li>Les chiffres de l’atelier sur le modèle économique sont inventés, pour des calculs simples.</li>
<li>Les publications à classer comme info ou intox sont des cas types. Dans la vie réelle, la vérification demande plus de recherche.</li>
</ul>` });

COURSE.push({ id: 'glossaire', t: 'Glossaire', h: `
<dl class="gloss">
<dt>Algorithme de recommandation</dt><dd>Programme qui choisit et classe les contenus montrés à chaque utilisateur.</dd>
<dt>Arête</dt><dd>Lien entre deux sommets d’un graphe (une relation entre deux personnes).</dd>
<dt>Bulle de filtres</dt><dd>Univers de contenus réduit à ce que l’algorithme pense qu’on aime.</dd>
<dt>Chambre d’écho</dt><dd>Espace où l’on ne rencontre que des opinions semblables aux siennes.</dd>
<dt>Cyberharcèlement</dt><dd>Harcèlement exercé par des moyens numériques.</dd>
<dt>Degré</dt><dd>Nombre d’arêtes d’un sommet (nombre d’amis).</dd>
<dt>Distance</dt><dd>Longueur du plus court chemin entre deux sommets.</dd>
<dt>Donnée personnelle</dt><dd>Information qui permet d’identifier une personne.</dd>
<dt>E-réputation</dt><dd>Image de soi donnée sur Internet.</dd>
<dt>Engagement</dt><dd>Temps passé et réactions des utilisateurs sur une plateforme.</dd>
<dt>Graphe</dt><dd>Ensemble de sommets reliés par des arêtes.</dd>
<dt>Hameçonnage</dt><dd>Arnaque qui imite un service connu pour voler des informations.</dd>
<dt>Hub</dt><dd>Sommet qui a un très grand nombre de relations.</dd>
<dt>Identité numérique</dt><dd>Ensemble des traces et informations liées à une personne sur Internet.</dd>
<dt>Intox</dt><dd>Fausse information diffusée pour tromper.</dd>
<dt>Petit monde</dt><dd>Propriété d’un réseau où deux personnes sont séparées par peu d’intermédiaires.</dd>
<dt>Publicité ciblée</dt><dd>Publicité montrée à un public choisi grâce à des données.</dd>
<dt>RGPD</dt><dd>Règlement européen sur la protection des données personnelles.</dd>
<dt>Sommet</dt><dd>Élément d’un graphe (une personne dans un réseau social).</dd>
<dt>Viralité</dt><dd>Propagation très rapide d’un contenu par partages successifs.</dd>
</dl>` });
/*COURSE-END*/

/* ---------- interface ---------- */
const UI = { cur: 's1' };
const AS = { key: 's1', tab: 'steps', open: false, st: lsGet(KEYS.act, {}), arm: null };
const CS = { open: false, id: 'web' };
function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }

function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': w.id === UI.cur ? 'true' : 'false', 'aria-selected': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id) }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');
  $('#hint').textContent = w.hint; root.innerHTML = '';
  w.mount(root);
  const sc = $('#scroller'); if (sc) sc.scrollTop = 0;
}
function gotoWs(id) {
  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}

function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open; box.classList.toggle('sheet', AS.open && isSmall());
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
box.dataset.k = tag;
  box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', null, (i + 1) + '. ' + q.q));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', null, o + (good ? '  ✓' : '') + (bad ? '  ✗' : ''))));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why' }, (miss ? 'Sans réponse. ' : '') + q.w)); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
box.append(body); body.scrollTop = keep;
}
function actToggle() {
  if (CS.open) { CS.open = false; renderCourse(); }
  AS.open = !AS.open; renderAct();
}
$('#bAct').addEventListener('click', actToggle);

/* ---------- cours ---------- */
function widgetHand(root) {
  let f = 150;
  const out = h('div'), rg = h('input', { type: 'range', min: 10, max: 500, step: 10, value: f, 'aria-label': 'Nombre d’amis par personne' });
  const draw = () => { f = +rg.value; out.innerHTML = '';
    out.append(h('p', null, 'Si chaque personne a ', h('b', null, f + ' amis'), ', le nombre maximal de personnes atteintes est :'),
      h('table', { class: 'ctable' }, h('thead', null, h('tr', null, h('th', null, 'Étapes'), h('th', null, 'Personnes atteignables (maximum)'))), h('tbody', null,
        [1, 2, 3, 4].map(k => h('tr', null, h('td', null, String(k)), h('td', null, Math.pow(f, k).toLocaleString('fr-FR')))))),
      h('p', { class: 'small' }, 'Il y a environ 8 milliards d’humains : avec ' + f + ' amis, quelques étapes suffisent en théorie pour atteindre tout le monde.')); };
  rg.addEventListener('input', draw); draw();
  root.append(h('label', { class: 'fld' }, h('span', null, 'Nombre d’amis par personne (10 à 500)'), rg), out);
}

function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }
function renderCourse() {
  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false'); btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;
  if (!CS.open) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);
  const go = id => { CS.id = id; renderCourse(); };
  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', { type: 'button', class: s.id === cur.id ? 'on' : '', 'aria-current': s.id === cur.id ? 'true' : 'false', onclick: () => go(s.id) }, (i + 1) + '. ' + s.t)));
  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: cur.h }));
  art.querySelectorAll('[data-w]').forEach(w => { if (w.dataset.w === 'hand') widgetHand(w); });
  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : notions des réseaux sociaux'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

/* ---------- aide ---------- */
function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));

document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Cinq ateliers pour comprendre les réseaux sociaux (SNT, seconde). Le réseau « LycéeGram » et toutes ses personnes sont fictifs.</p>' +
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut.</li><li>Le bouton <b>Activité</b> affiche les consignes, un défi et un QCM avec correction.</li><li>Le bouton <b>Cours</b> détaille toutes les notions.</li></ul>' +
    '<h3>Vos données</h3><p>Les réponses au QCM sont mémorisées dans ce navigateur uniquement.</p>' }));
});

/* ---------- démarrage ---------- */
(function init() {
    AS.open = !isSmall();
  renderSeg(); mountWs(); renderAct(); renderCourse();
})();
