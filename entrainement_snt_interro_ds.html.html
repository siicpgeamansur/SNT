{ s: 'nb', l: 3, k: 'out', ask: 'Que affiche ce programme ?', code: `print(0.1 + 0.2 == 0.3, round(0.1 + 0.2, 2) == 0.3)`, ans: 'False True', e: 'Les flottants sont stockés en binaire et 0,1 n’a pas d’écriture binaire exacte (comme 1/3 en décimal) : 0.1 + 0.2 vaut 0.30000000000000004, donc différent de 0.3. Après <code>round(..., 2)</code> la comparaison réussit. On ne compare donc jamais deux flottants avec <code>==</code> sans précaution.', lien: 'Les nombres à virgule sont des approximations.' }

/* ---------- coloration Python ---------- */
const PYKW = new Set('def return if elif else for while in and or not import from as True False None break continue pass lambda is'.split());
const PYBI = new Set('print len range sum min max abs round int float str list dict sorted enumerate zip bin hex type any all'.split());
function hlPy(src) {
  const re = /(#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(\b0[xXbB][0-9a-fA-F]+\b|\b\d[\d_]*\.?\d*\b)|([A-Za-z_À-ſ][A-Za-z_0-9À-ſ]*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index)); last = re.lastIndex;
    const t = esc(m[0]);
    if (m[1]) out += '<span class="pc">' + t + '</span>';
    else if (m[2]) out += '<span class="ps">' + t + '</span>';
    else if (m[3]) out += '<span class="pn">' + t + '</span>';
    else if (PYKW.has(m[4])) out += '<span class="pk">' + t + '</span>';
    else if (PYBI.has(m[4])) out += '<span class="pf">' + t + '</span>';
    else out += t;
  }
  return out + esc(src.slice(last));
}
const codeEl = src => h('pre', { class: 'code', html: hlPy(src) });

/* ---------- instances de questions ---------- */
function mkInst(q) { return { q, ord: q.k === 'qcm' ? shuffle([0, 1, 2, 3]) : null, a: q.k === 'code' ? q.start : (q.k === 'qcm' ? null : ''), verified: false, revealed: false, res: null }; }
const answered = i => i.q.k === 'qcm' ? i.a != null : i.q.k === 'out' ? i.a.trim() !== '' : i.a.trim() !== i.q.start.trim();
function grade(i) {
  const q = i.q;
  if (q.k === 'qcm') return { ok: i.a != null && i.ord[i.a] === 0 };
  if (q.k === 'out') return { ok: normOut(i.a) === normOut(q.ans) };
  const r = pyCheck({ tests: q.tests }, i.a); return { ok: r.pass, tests: r.results };
}
function record(i, ok) { const d = store(); d.res[i.q.id] = { ok, t: Date.now() }; saveStore(d); }

/* ---------- affichage d'une question ---------- */
function qView(i, o) {
  o = o || {}; const q = i.q;
  const card = h('div', { class: 'qcard' }), fb = h('div', { class: 'qfb' });
  card.append(h('div', { class: 'qh' }, o.num ? h('b', null, 'Question ' + o.num) : null, h('span', { class: 'lv l' + q.l, title: LVN[q.l] }, STAR[q.l]), h('span', { class: 'sc' }, SEC[q.s].c), h('span', { class: 'pts' }, PTS[q.l] + (PTS[q.l] > 1 ? ' points' : ' point'))));
  card.append(h('p', { class: 'qask', html: q.ask }));
  if (q.k !== 'code') card.append(codeEl(q.code));
  const locked = () => o.locked;
  let optEls = [];
  if (q.k === 'qcm') {
    const box = h('div', { class: 'qopts', role: 'radiogroup', 'aria-label': 'Réponses possibles' });
    i.ord.forEach((oi, pos) => {
      const inp = h('input', { type: 'radio', name: 'r-' + q.id + (o.uid || ''), disabled: locked() ? 'disabled' : null });
      if (i.a === pos) inp.checked = true;
      inp.addEventListener('change', () => { i.a = pos; if (o.onChange) o.onChange(i); });
      const lab = h('label', { class: 'opt' }, inp, h('span', { class: 'mono' }, q.o[oi])); optEls[pos] = lab; box.append(lab);
    });
    card.append(box);
  } else {
    const ta = h('textarea', { class: 'qin mono' + (q.k === 'code' ? ' ced' : ''), rows: q.k === 'code' ? Math.max(6, q.sol.split('\n').length + 2) : Math.max(1, q.ans.split('\n').length), spellcheck: 'false', autocomplete: 'off', autocapitalize: 'off', 'aria-label': q.k === 'code' ? 'Votre code Python' : 'Votre réponse', placeholder: q.k === 'code' ? '' : 'Ce que le programme affiche…' });
    ta.value = i.a; if (locked()) ta.disabled = true;
    ta.addEventListener('input', () => { i.a = ta.value; if (o.onChange) o.onChange(i); });
    if (q.k === 'code') ta.addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.value = ta.value.slice(0, s) + '    ' + ta.value.slice(ta.selectionEnd); ta.selectionStart = ta.selectionEnd = s + 4; i.a = ta.value; } });
    card.append(ta);
    if (q.k === 'out') card.append(h('p', { class: 'small' }, 'Écrivez exactement ce que le programme affiche (sans guillemets autour du texte, sauf s’ils sont affichés).'));
  }
  card.append(fb);
  /* retour */
  function show(kind) { /* kind : 'verify' | 'reveal' | 'review' */
    fb.innerHTML = '';
    const r = i.res = grade(i);
    if (kind !== 'reveal') fb.append(h('p', { class: 'verdict ' + (r.ok ? 'yes' : 'no') }, r.ok ? 'Bonne réponse !' : (answered(i) ? 'Réponse incorrecte.' : 'Pas de réponse.')));
    if (q.k === 'qcm') optEls.forEach((lab, pos) => { lab.classList.remove('good', 'bad'); if (i.ord[pos] === 0) lab.classList.add('good'); else if (i.a === pos) lab.classList.add('bad'); });
    if (q.k === 'code' && r.tests && kind !== 'reveal') fb.append(h('ul', { class: 'tl2' }, r.tests.map(t => h('li', { class: t.ok ? 'tok' : 'tko' }, h('b', null, (t.ok ? '✓ ' : '✗ ') + t.label), t.detail ? h('pre', { class: 'small', style: 'margin:2px 0 0;white-space:pre-wrap' }, t.detail) : null))));
    if (!r.ok || kind === 'reveal') {
      fb.append(h('p', { class: 'qlab' }, q.k === 'code' ? 'Une solution possible :' : 'Réponse attendue :'));
      fb.append(q.k === 'qcm' ? h('p', { class: 'mono exp' }, q.o[0]) : q.k === 'out' ? h('pre', { class: 'code exp' }, q.ans) : codeEl(q.sol));
    }
    fb.append(h('div', { class: 'expl' }, h('p', { class: 'qlab' }, 'Explication'), h('p', { html: q.e }), q.lien ? h('p', { class: 'lien' }, h('b', null, 'Lien avec la SNT : '), q.lien) : null));
    return r;
  }
  return { el: card, show, fb };
}

function trainRun(root) {

/* ---------- EXAMEN ---------- */

  const dur = (CFG.dur === 'auto' ? mins : +CFG.dur) * 60;

}

      h('p', { class: 'score' }, p.length ? 'L’examen comportera ' + n + ' question' + (n > 1 ? 's' : '') + ' tirées au hasard parmi ' + p.length + ', réparties entre les niveaux choisis.' : 'Aucune question ne correspond à ces choix.'),
      h('button', { class: 'btn pri', type: 'button', disabled: p.length ? null : 'disabled', onclick: () => { X.ex = buildExam(); X.tick = setInterval(tick, 500); render(); } }, 'Démarrer l’examen'));
  };
  root.append(h('h2', null, 'Mode examen'), h('p', null, 'Les questions s’affichent sur une même feuille, avec un chronomètre. Aucune correction pendant l’épreuve : vous répondez, puis un bouton final affiche pour chaque question si votre réponse est bonne ou non, avec l’explication. Le temps écoulé termine l’examen automatiquement.'), LEGEND);

function tick() {

}

/* ---------- BILAN ---------- */
let wipe = false;
function bilanView(root) {

}

/* ---------- application ---------- */
