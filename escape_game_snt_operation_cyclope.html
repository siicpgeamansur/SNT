        h('li', null, 'Chaque salle correspond à un thème du programme : Python et nombres, Internet, Web, réseaux sociaux, données, localisation, photographie, objets connectés.'),
        h('li', null, 'Une salle s’ouvre quand la précédente est résolue. Chaque salle te donne un indice pour ton carnet.'),
        h('li', null, 'Tu peux demander des indices, mais ils coûtent des points. Une mauvaise accusation aussi.'),
        h('li', null, 'Le scénario est fictif ; les dossiers historiques, eux, racontent des événements réels en France.'))),
    h('div', { class: 'ans' },
      h('button', { class: 'btn pri', onclick: () => { if (!started) { S = fresh(); S.t0 = Date.now(); } S.st = 1; save(); render(); } }, started ? 'Reprendre la mission' : 'Accepter la mission')));
}

function hall() {
  return h('div', { class: 'hall', role: 'navigation', 'aria-label': 'Salles' }, ...ROOMS.concat([{ n: 'Confrontation', th: 'Qui est la taupe ?' }]).map((r, i) => {
    const ok = i < FIN ? roomDone(r) : false, lock = i === FIN ? nDone() < FIN : !unlocked(i);
    return h('button', { class: 'door' + (S.cur === i ? ' cur' : '') + (ok ? ' ok' : '') + (lock ? ' lock' : ''), disabled: lock, 'aria-label': r.n + (ok ? ' (résolue)' : lock ? ' (verrouillée)' : ''), onclick: () => { S.cur = i; save(); render(); window.scrollTo(0, 0); } },
      h('b', null, i < FIN ? 'SALLE ' + (i + 1) + (ok ? ' ✓' : lock ? ' ⛔' : '') : 'FINALE' + (lock ? ' ⛔' : '')), h('span', null, r.n));
  }));
}
function carnet() {
  const cl = clues();
  return h('div', { class: 'side' }, h('div', { class: 'sidecard' }, h('h3', null, 'Carnet d’enquête'),
    cl.length ? h('ul', { class: 'cl' }, cl.map(x => h('li', null, h('b', null, 'SALLE ' + (ROOMS.indexOf(x.r) + 1) + ' · ' + x.r.th), x.c.t))) : h('p', { class: 'muted' }, 'Les indices trouvés apparaîtront ici.')));
}
function game() {
  const main = S.cur === FIN ? finale() : room(ROOMS[S.cur], S.cur);
  return h('div', null, hall(), h('div', { class: 'grid' }, main, carnet()));
}

function room(r, i) {
  const wrap = h('div', { style: 'min-width:0' });
  wrap.append(h('h2', null, 'Salle ' + (i + 1) + ' : ' + r.n), h('div', { class: 'muted' }, 'Thème : ' + r.th),
    h('div', { class: 'term', style: 'margin-top:10px' }, r.intro.map(l => h('p', { class: l.startsWith('> ') ? '' : 'a' }, l))));
  r.pz.forEach((p, k) => wrap.append(puzzle(r, p, k)));
  if (roomDone(r)) wrap.append(h('div', { class: 'win' }, h('b', null, 'Salle résolue.'), h('p', { style: 'margin:6px 0' }, 'Nouvel indice dans ton carnet : ', h('em', null, r.clue.t)),
    h('div', { class: 'ans' }, h('button', { class: 'btn pri', onclick: () => { S.cur = i + 1; save(); render(); window.scrollTo(0, 0); } }, i + 1 < FIN ? 'Salle suivante' : 'Aller à la confrontation'))),
    h('details', { class: 'dos' }, h('summary', null, 'Dossier réel : ' + r.dos[0]), h('p', null, r.dos[1])));
  return wrap;
}

function puzzle(r, p, k) {
  const done = !!S.ok[p.id];
  const card = h('section', { class: 'card' + (done ? ' done' : '') });
  const fb = h('div', { class: 'fb', role: 'status' });
  const api = { submit: good => { if (good) solve(); else { fb.textContent = 'Ce n’est pas le bon résultat. Réessaie !'; fb.className = 'fb bad'; } } };
  const solve = () => { S.ok[p.id] = 1; save(); keepScroll(() => { const was = roomDone(r); render(); if (!was && roomDone(r)) toast('Salle déverrouillée !'); }); };
  card.append(h('div', { class: 'ph' }, h('span', { class: 'badge' }, 'ÉNIGME ' + (k + 1) + (done ? ' ✓' : '')), h('h3', null, p.t)), h('div', { html: p.q }));
  if (p.w) card.append(p.w(api, done));
  if (!done) {
    if (p.kind === 'text') {
      const inp = h('input', { type: 'text', placeholder: p.ph, autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', 'aria-label': 'Ta réponse' });
      const go = () => api.submit(p.ok(inp.value));
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
      card.append(h('div', { class: 'ans' }, inp, h('button', { class: 'btn pri', onclick: go }, 'Valider')));
    } else if (p.kind === 'qcm') {
      const opts = shuffle(p.o, hash(p.id));
      card.append(h('div', { class: 'opts' }, opts.map(o => { const b = h('button', { class: 'opt', onclick: () => { if (o === p.o[0]) { b.className = 'opt ok'; solve(); } else { b.className = 'opt bad'; fb.textContent = 'Non, cherche encore.'; fb.className = 'fb bad'; } } }, o); return b; })));
    }
    card.append(fb);
    const hl = h('div', { class: 'hints' }), n = S.hint[p.id] || 0;
    const hb = h('button', { class: 'btn sm', style: 'margin-top:8px' }, '');
    const drawH = () => { const c = S.hint[p.id] || 0; hl.replaceChildren(...p.h.slice(0, c).map((t, i) => h('div', { class: 'hint' }, 'Indice ' + (i + 1) + ' : ' + t))); hb.textContent = 'Demander un indice (' + c + '/' + p.h.length + ')'; hb.disabled = c >= p.h.length; };
    hb.onclick = () => { S.hint[p.id] = (S.hint[p.id] || 0) + 1; save(); drawH(); topbar(); };
    drawH(); card.append(hb, hl);
  } else {
    card.append(h('div', { class: 'ex', html: p.ex }));
  }
  return card;
}

function finale() {
  const wrap = h('div', { style: 'min-width:0' });
  wrap.append(h('h2', null, 'Confrontation'), h('div', { class: 'muted' }, 'Thème : tout le programme'),
    h('div', { class: 'term', style: 'margin-top:10px' }, h('p', null, '> CYCLOPE est entièrement déchiffré. Il ne reste qu’une personne à interpeller.'), h('p', { class: 'a' }, '> Compare chaque suspect avec tes indices, raye ceux qui sont écartés, puis interpelle la taupe.')));
  const msg = h('div', { class: 'fb bad', role: 'status' });
  const rows = SUSP.map(s => {
    const tr = h('tr', { class: struck[s.nom] ? 'x' : '' });
    const draw = () => { tr.className = struck[s.nom] ? 'x' : ''; };
    tr.append(h('td', { class: 'nm' }, s.nom), ...ATTR.map(a => h('td', null, s[a[0]])),
      h('td', null, h('button', { class: 'btn sm', onclick: () => { struck[s.nom] = !struck[s.nom]; draw(); } }, 'Rayer / garder')),
      h('td', null, h('button', { class: 'btn sm pri', onclick: function () {
        if (this.dataset.c !== '1') { this.dataset.c = '1'; this.textContent = 'Confirmer ?'; return; }
        accuse(s, msg);
      } }, 'Interpeller')));
    return tr;
  });
  wrap.append(h('div', { class: 'card' }, h('h3', null, 'Les cinq suspects'),
    h('div', { class: 'dwrap' }, h('table', { class: 'dt sus' }, h('thead', null, h('tr', null, h('th', null, 'Nom'), ...ATTR.map(a => h('th', null, a[1])), h('th', null, ''), h('th', null, ''))), h('tbody', null, rows))), msg));
  return wrap;
}
function accuse(s, msg) {
  const bad = ATTR.find(a => s[a[0]] !== TRUTH[a[0]]);
  if (!bad) { S.st = 2; S.t1 = Date.now(); save(); render(); window.scrollTo(0, 0); return; }
  S.wrong++; save(); topbar();
  const rl = ROOMS.find(r => r.clue.a === bad[0]);
  msg.textContent = s.nom + ' ne correspond pas : l’indice de la salle « ' + rl.n + ' » (' + bad[1].toLowerCase() + ') l’écarte. Revois ton carnet.';
  render0(); function render0() { const y = window.scrollY; render(); window.scrollTo(0, y); const m = $('.fb.bad[role=status]'); if (m) m.textContent = msg.textContent; }
}

function ending() {
  const pen = hintsTotal() + 2 * S.wrong, stars = pen <= 3 ? 3 : pen <= 9 ? 2 : 1, rank = ['Agent stagiaire', 'Agent confirmé', 'Agent d’élite'][stars - 1];
  return h('div', { style: 'max-width:780px;margin:0 auto' },
    h('h1', null, 'Mission accomplie'),
    h('div', { class: 'stars', 'aria-label': stars + ' étoiles sur 3' }, '★'.repeat(stars) + '☆'.repeat(3 - stars)),
    h('div', { class: 'muted' }, rank),
    h('div', { class: 'kpis' }, h('div', { class: 'kpi' }, 'Temps', h('b', null, mmss(S.t1 - S.t0))), h('div', { class: 'kpi' }, 'Indices utilisés', h('b', null, hintsTotal())), h('div', { class: 'kpi' }, 'Mauvaises accusations', h('b', null, S.wrong))),
    h('div', { class: 'term' },
      h('p', { class: 'g' }, '> TAUPE IDENTIFIÉE : Max Delattre, service Infrastructure.'),
      h('p', null, 'Domicilié à Grenoble, joueur d’échecs en club, il est arrivé en moto à 2 h 14 par le parking, a branché CYCLOPE dans le bâtiment B et a programmé l’effacement des traces. Il avait cliqué sur le lien piégé, puis s’est trahi par ses publications, son badge et ses déplacements.'),
      h('p', { class: 'a' }, '> Il est interpellé à l’aube. Les plans industriels n’ont pas quitté le réseau. Bravo, agent.')),
    h('div', { class: 'card' }, h('h3', null, 'Ce que tu as mobilisé'), h('ul', null, ROOMS.map(r => h('li', null, h('b', null, r.n + ' : '), r.th + ' (dossier : ' + r.dos[0] + ')')))),
    ROOMS.map(r => h('details', { class: 'dos' }, h('summary', null, 'Dossier réel : ' + r.dos[0]), h('p', null, r.dos[1]))),
    h('div', { class: 'ans' }, h('button', { class: 'btn pri', onclick: () => { S = fresh(); struck = {}; save(); render(); window.scrollTo(0, 0); } }, 'Rejouer')));
}

$('#bReset').addEventListener('click', () => { if (!resetAsk) { resetAsk = true; topbar(); setTimeout(() => { resetAsk = false; topbar(); }, 4000); return; } resetAsk = false; S = fresh(); struck = {}; save(); render(); window.scrollTo(0, 0); });
setInterval(tick, 1000);
if (S.cur > FIN || S.cur < 0 || (S.cur < FIN && !unlocked(S.cur))) S.cur = 0;
render();
/*GUI-END*/

</script>
